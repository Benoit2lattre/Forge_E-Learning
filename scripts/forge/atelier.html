<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AtelierForge</title>
<link rel="icon" href="/static/identite/icones/atelierforge_icone_jour_32.png">
<style>
:root{--navy:#14213D;--navy2:#28406B;--slate:#748CAB;--slate-l:#D3DDEC;--sand:#E0B989;--sand-l:#F4E6D2;--fond:#F7F6F4;--carte:#fff;--bord:#CDC9C0;
  --texte:#1A1815;--texte2:#615C52;--ok:#5C8A66;--ok-l:#E4F0E6;--ko:#B85C50;--ko-l:#F6E3E0;--focus:#FFCD00;
  --filet:#ECE9E3;--entete-t:#F0EEEA;--fond-pre:#FBFAF8;--ok-t:#2E5A38;--ko-t:#7C2F25;--sable-t:#6B4A1E;--bouton:#14213D;--bouton2:#28406B;--bouton-t:#fff;color-scheme:light}
:root[data-theme=nuit]{--navy:#0B1222;--navy2:#1F3354;--slate:#5E7799;--slate-l:#2A3A55;--sand:#E0B989;--sand-l:#4A3A24;--fond:#14171C;--carte:#1D2127;--bord:#3A3F47;
  --texte:#E8E6E1;--texte2:#A7A39A;--ok:#7FB08A;--ok-l:#1F3526;--ko:#D98C80;--ko-l:#3D2320;--filet:#2A2E35;--entete-t:#252A31;--fond-pre:#171A1F;
  --ok-t:#A9D4B2;--ko-t:#F0B3A9;--sable-t:#E8C99C;--bouton:#C9D6EA;--bouton2:#E0E8F4;--bouton-t:#0B1222;color-scheme:dark}
.btn.second{background:var(--carte);color:var(--texte);border:1px solid var(--slate)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--texte);background:var(--fond);font-size:15px;
  display:grid;grid-template-rows:56px minmax(0,1fr) auto;overflow:hidden;grid-template-columns:224px 1fr;grid-template-areas:"tete tete" "nav main" "nav taches"}
button,select,input{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
main:focus,main:focus-visible{outline:none}
header{grid-area:tete;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px}
header h1{font-size:18px;margin:0;font-weight:600}
header h1.cache{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header .version{color:#B7C4DA;font-size:13px}
header .espace{flex:1}
header button{margin-left:8px;background:transparent;color:#fff;border:1px solid var(--slate);border-radius:6px;padding:6px 12px;cursor:pointer}
header button:hover{background:var(--navy2)}
nav{grid-area:nav;background:var(--carte);border-right:1px solid var(--bord);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--texte)}
nav button img{width:24px;height:24px}
nav button .bientot{margin-left:auto;font-size:11px;color:var(--texte2);background:var(--fond);border-radius:10px;padding:1px 7px}
nav button:hover{background:var(--fond)}
nav button[aria-current="page"]{background:var(--slate-l);font-weight:600}
nav .bas{margin-top:auto;font-size:12px;color:var(--texte2);padding:8px 10px;line-height:1.4}
main{grid-area:main;overflow:auto;padding:22px 28px 28px}
main h2{font-size:22px;margin:0}
.entete{display:flex;align-items:center;gap:18px;margin:0 0 10px}
.entete img{height:56px;width:auto}
.entete img + h2{border-left:2px solid var(--bord);padding-left:18px}
main .chapeau{color:var(--texte2);margin:0 0 18px;max-width:900px}
.cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:26px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.carte .nom{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.carte .nom img{width:32px;height:32px}
.carte p{margin:0;color:var(--texte2);font-size:14px;flex:1}
.carte button{align-self:flex-start}
h3{font-size:16px;margin:22px 0 8px}
table{border-collapse:collapse;width:100%;background:var(--carte);border:1px solid var(--bord);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--filet);vertical-align:top;font-size:14px}
th{background:var(--entete-t);font-weight:600;color:var(--texte2);font-size:13px}
tr:last-child td{border-bottom:0}
td .sous{display:block;color:var(--texte2);font-size:12.5px;margin-top:2px}
.pastille{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12.5px;white-space:nowrap}
.p-ok{background:var(--ok-l);color:var(--ok-t)}.p-ko{background:var(--ko-l);color:var(--ko-t)}.p-neutre{background:var(--filet);color:var(--texte2)}.p-sable{background:var(--sand-l);color:var(--sable-t)}
.btn{background:var(--bouton);color:var(--bouton-t);border:0;border-radius:7px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bouton2)}

.btn.second:hover{background:var(--fond)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.barre{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:0 0 14px}
.barre label{display:flex;align-items:center;gap:8px;color:var(--texte2)}
.barre select,.barre input[type=search]{padding:6px 8px;border:1px solid var(--bord);border-radius:6px;background:var(--carte);min-width:200px}
.vide{color:var(--texte2);font-style:italic;padding:14px}
.barre select.large{min-width:420px}
.sous{color:var(--texte2);font-size:13px}
.resume{margin:0 0 14px;color:var(--texte)}
.remarques{display:inline-block;margin-left:6px}.remarques summary{cursor:pointer;color:var(--sable-t)}.remarques ul{margin:6px 0 0;max-height:220px;overflow:auto;font-size:13px}.remarques li.erreur{color:var(--ko-t)}
.etapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;margin-bottom:8px;align-items:start}
.etapes .carte p{flex:none}
.etapes .carte{gap:8px}.etapes .carte .nom{font-size:15px}
.etapes label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--texte2)}
.etapes label select{padding:5px 6px;border:1px solid var(--bord);border-radius:6px;background:var(--carte);color:var(--texte);font-size:14px}
label.case{flex-direction:row !important;align-items:center;gap:6px}
.ligne{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ligne b{display:block;font-size:13.5px;word-break:break-all}
.diaporama{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-bottom:8px;border-bottom:1px solid var(--filet)}
.diaporama b{font-size:13.5px;word-break:break-all}
.btn.petit{padding:3px 9px;font-size:13px}
.paquets{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--filet);padding-top:8px}
.paquet{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.paquet b{display:block;font-size:13px;font-weight:600}
.paquet .sous{display:block;font-size:12px}
.carte.etroite{max-width:640px}
table.sections td,table.sections th{padding:6px 8px;font-size:13px}
table.sections tr.partie td{background:var(--entete-t);font-weight:600}
table.sections tr.partie .pastille{margin-left:8px;font-weight:400}
table.sections tr.partie .sous{margin-left:10px;font-weight:400}
dialog.formulaire{border:1px solid var(--bord);border-radius:10px;padding:18px 22px;min-width:460px;max-width:620px;display:flex;flex-direction:column;gap:10px}
dialog.formulaire[open]{display:flex}
dialog.formulaire label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--texte2)}
dialog.formulaire select,dialog.formulaire input[type=text]{padding:6px;border:1px solid var(--bord);border-radius:6px;font-size:14px}
dialog.formulaire h3{margin:0 0 4px}
dialog.formulaire.large{max-width:1100px;width:92vw}.bloc-registre h4{margin:6px 0}.bloc-registre input[type=text]{width:100%;margin-bottom:4px}
.panneau-rec{position:fixed;right:20px;bottom:280px;z-index:8;background:var(--carte);border:2px solid var(--ko);border-radius:12px;padding:12px 16px;box-shadow:0 6px 24px #0004;display:flex;flex-direction:column;gap:8px;max-width:340px}
.panneau-rec p{margin:0;font-size:13px;color:var(--texte2)}
.rec-etat{font-weight:600}.rec-etat.actif{color:var(--ko)}
p.erreur{color:var(--ko-t)}
header .cours-actif{display:flex;align-items:center;gap:8px;margin-left:18px;color:#B7C4DA;font-size:13px}
header .cours-actif select{background:var(--navy2);color:#fff;border:1px solid var(--slate);border-radius:6px;padding:5px 8px;max-width:420px}
.note-cours{margin:-8px 0 14px;font-size:13px;color:var(--texte2)}
.cartes-cours{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.cartes-cours .large{grid-column:1/-1}.cartes-cours .pile{display:flex;flex-direction:column;gap:14px}
.cartes-cours label,.grille2 label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--texte2)}
.cartes-cours input[type=text],.cartes-cours textarea,.cartes-cours select,dialog.formulaire textarea{padding:6px;border:1px solid var(--bord);border-radius:6px;font:inherit;font-size:14px;background:var(--carte);color:var(--texte)}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table.compact td{padding:5px 8px;font-size:13px}.chemin{font-size:12.5px;word-break:break-all}
.edition{padding:3px 0}.sous-l{color:var(--texte2);font-size:12.5px}
.avec-bouton{display:flex;gap:8px;align-items:center}.avec-bouton select{flex:1;min-width:0}
.mesure{margin:-4px 0 6px}.mesure .jauge{height:8px;border-radius:4px;background:var(--filet);overflow:hidden;margin-bottom:4px}
.mesure .niveau{height:100%;width:0;background:var(--sable-t);transition:width .4s}.mesure.ok .niveau{background:var(--ok-t)}.mesure.ko .niveau{background:var(--ko-t)}
dialog.formulaire input[type=number]{padding:6px;border:1px solid var(--bord);border-radius:6px;font-size:14px;width:140px}
.ligne.gauche{justify-content:flex-start;gap:18px}
main > .carte.etroite{margin-bottom:14px}
dialog.formulaire .bloc{display:flex;flex-direction:column;gap:10px;border-left:3px solid var(--slate-l);padding-left:12px}
dialog.formulaire .bloc[hidden]{display:none}
#taches{grid-area:taches;overflow:hidden;border-top:2px solid var(--navy);background:var(--carte);display:grid;grid-template-columns:300px 1fr;height:260px;min-height:0}
#taches.replie{height:38px}
#taches .liste{border-right:1px solid var(--bord);overflow:auto;min-height:0}
#taches .titre-zone{display:flex;align-items:center;gap:10px;padding:8px 12px;font-weight:600;font-size:14px;background:var(--entete-t);position:sticky;top:0}
#taches .titre-zone button{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--texte2);font-size:13px}
.tache{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-bottom:1px solid var(--entete-t);cursor:pointer;font-size:13.5px}
.tache:hover{background:var(--fond)}
.tache[aria-selected="true"]{background:var(--slate-l)}
.tache .icone{width:18px;flex:none;text-align:center}
.tache .duree{display:block;color:var(--texte2);font-size:12px}
.journal{display:flex;flex-direction:column;min-height:0}
.journal .outils{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--bord);min-height:40px;flex-wrap:wrap}
.journal .outils .etat{font-weight:600;font-size:14px;margin-right:6px}
.journal pre{margin:0;padding:8px 12px;overflow:auto;flex:1;font:12.5px/1.45 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;background:var(--fond-pre)}
.tourne{display:inline-block;animation:tour 1s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
.message{position:fixed;right:20px;top:68px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;max-width:420px;box-shadow:0 4px 18px #0003;z-index:9}
.message.erreur{background:var(--ko-t)}
@media (max-width:900px){body{grid-template-columns:1fr;grid-template-areas:"tete" "nav" "main" "taches"}nav{flex-direction:row;overflow:auto}nav .bas{display:none}}
</style>
</head>
<body>
<header>
  <img src="/static/identite/logos/atelierforge_logo_nuit.png" srcset="/static/identite/logos/atelierforge_logo_nuit@2x.png 2x" alt="AtelierForge" height="38" data-fixe onerror="this.remove(); document.querySelector('header h1').classList.remove('cache')">
  <h1 class="cache">AtelierForge</h1><span class="version" id="version"></span>
  <label class="cours-actif">Cours <select id="cours-actif" aria-label="Cours choisi : limite les listes"><option value="">Tous les cours</option></select></label>
  <span class="espace"></span>
  <button type="button" id="theme" title="Apparence : jour ou nuit">☾ Nuit</button>
  <button type="button" id="quitter" title="Arrêter l'atelier (la fenêtre de commande se ferme)">Quitter</button>
</header>
<nav aria-label="Écrans">
  <button type="button" data-ecran="accueil" aria-current="page"><img src="/static/identite/icones/atelierforge_icone_jour_32.png" alt="">Accueil</button>
  <button type="button" data-ecran="cours"><img src="/static/identite/icones/exoforge_icone_jour_32.png" alt="" style="visibility:hidden">Cours</button>
  <button type="button" data-ecran="questions"><img src="/static/identite/icones/quizforge_icone_jour_32.png" alt="">Questions</button>
  <button type="button" data-ecran="exercices"><img src="/static/identite/icones/exoforge_icone_jour_32.png" alt="">Exercices</button>
  <button type="button" data-ecran="capsules"><img src="/static/identite/icones/capsuleforge_icone_jour_32.png" alt="">Capsules</button>
  <button type="button" data-ecran="bilans"><img src="/static/identite/icones/diagforge_icone_jour_32.png" alt="">Bilans</button>
  <button type="button" data-ecran="reglages"><img src="/static/identite/icones/exoforge_icone_jour_32.png" alt="" style="visibility:hidden">Réglages</button>
  <div class="bas" id="racine"></div>
</nav>
<main id="main" tabindex="-1"></main>
<section id="taches" aria-label="Tâches">
  <div class="liste">
    <div class="titre-zone">Tâches <span class="pastille p-neutre" id="nb-taches">0</span><button type="button" id="replier" aria-expanded="true">Replier ▾</button></div>
    <div id="liste-taches" role="listbox" aria-label="Tâches de la séance"></div>
  </div>
  <div class="journal">
    <div class="outils" id="outils-tache"><span class="etat">Aucune tâche lancée.</span></div>
    <pre id="journal" aria-live="polite" aria-label="Journal de la tâche"></pre>
  </div>
</section>
<script>
"use strict";
/* ---------- apparence : jour, nuit ou celle du système ; logos et icônes « _jour » / « _nuit » suivent ---------- */
const sombreSysteme = window.matchMedia("(prefers-color-scheme: dark)");
function themeEffectif(choix) { return choix === "nuit" || (choix !== "jour" && sombreSysteme.matches) ? "nuit" : "jour"; }
function appliquerTheme(choix) {
  const th = themeEffectif(choix); document.documentElement.dataset.theme = th;
  document.querySelectorAll("img[src*='_jour'], img[src*='_nuit']").forEach(majImage);
  const b = document.getElementById("theme"); if (b) b.textContent = th === "nuit" ? "☀ Jour" : "☾ Nuit";
}
function majImage(img) { if (img.hasAttribute("data-fixe")) return; const th = document.documentElement.dataset.theme, s = img.getAttribute("src");
  const n = th === "nuit" ? s.replace("_jour", "_nuit") : s.replace("_nuit", "_jour"); if (n !== s) img.setAttribute("src", n); }
let THEME = (() => { try { return localStorage.getItem("forge-theme") || "auto"; } catch (e) { return "auto"; } })();
appliquerTheme(THEME);
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType !== 1) return;
  if (n.tagName === "IMG") majImage(n); n.querySelectorAll && n.querySelectorAll("img").forEach(majImage); }))).observe(document.documentElement, { childList: true, subtree: true });
sombreSysteme.addEventListener("change", () => appliquerTheme(THEME));
function choisirTheme(choix) { THEME = choix; try { localStorage.setItem("forge-theme", choix); } catch (e) {} appliquerTheme(choix); }
/* ---------- jeton (dans l'adresse, gardé pour un rechargement) ---------- */
const JETON = (() => { const m = location.search.match(/[?&]j=([\w-]+)/); if (m) { try { sessionStorage.setItem("forge-jeton", m[1]); } catch (e) {} history.replaceState(null, "", location.pathname); return m[1]; }
  try { return sessionStorage.getItem("forge-jeton") || ""; } catch (e) { return ""; } })();
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...enfants) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (v === undefined || v === null || v === false) continue; if (k.startsWith("on")) e[k] = v; else if (k === "html") e.innerHTML = v; else e.setAttribute(k, v === true ? "" : v); }
  for (const c of enfants.flat()) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : document.createTextNode(typo(String(c)))); return e; };
/* typographie française : espace fine avant ; ! ?, insécable avant : et », après « */
const typo = s => s.replace(/ ([;!?])/g, " $1").replace(/ ([:»])/g, " $1").replace(/« /g, "« ");
async function api(chemin, corps) {
  const r = await fetch(chemin, corps === undefined ? { headers: { "X-Jeton": JETON } }
    : { method: "POST", headers: { "X-Jeton": JETON, "Content-Type": "application/json" }, body: JSON.stringify(corps) });
  let d; try { d = await r.json(); } catch (e) { d = { ok: false, message: "réponse illisible (" + r.status + ")" }; }
  if (r.status === 403) message(d.message || "Accès refusé.", true);
  return d;
}
let minuterieMsg = null;
function message(texte, erreur) { let m = document.querySelector(".message"); if (!m) { m = el("div", { class: "message", role: "status" }); document.body.append(m); }
  m.className = "message" + (erreur ? " erreur" : ""); m.textContent = typo(texte); clearTimeout(minuterieMsg); minuterieMsg = setTimeout(() => m.remove(), erreur ? 7000 : 3500); }
const quand = s => { if (!s) return "jamais"; const d = new Date(s * 1000), j = new Date(); const h = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === j.toDateString() ? "aujourd'hui à " + h : d.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }) + " à " + h; };
const duree = s => s < 60 ? Math.round(s) + " s" : Math.floor(s / 60) + " min " + String(Math.round(s % 60)).padStart(2, "0") + " s";

/* ---------- écrans ---------- */
let ECRAN = "accueil", ETAT = null;
const ecrans = { accueil, cours, questions, exercices, capsules, bilans, reglages };
function aller(nom) { ECRAN = nom; document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.ecran === nom ? "page" : "false"));
  try { sessionStorage.setItem("forge-ecran", nom); } catch (e) {} ecrans[nom](); $("main").focus({ preventScroll: true }); }
document.querySelectorAll("nav button").forEach(b => b.onclick = () => aller(b.dataset.ecran));
function vider(...enfants) { const m = $("main"); m.replaceChildren(...enfants);
  if (["questions", "exercices", "capsules", "bilans"].includes(ECRAN)) { const n = noteCours(), ch = m.querySelector(".chapeau"); if (n && ch) ch.after(n); }
  return m; }
/* en-tête d'un écran : logo de l'outil (nom et devise) puis le nom de l'écran */
const entete = (outil, titre) => el("div", { class: "entete" }, outil ? el("img", { src: `/static/identite/logos/${outil}_logo_jour.png`, alt: { quizforge: "QuizForge", exoforge: "ExoForge", capsuleforge: "CapsuleForge", diagforge: "DiagForge" }[outil] }) : null, el("h2", {}, titre));
function bientot(outil, titre, lot) { vider(entete(outil, titre), el("p", { class: "chapeau" }, `Cet écran arrive avec le lot ${lot} de l'atelier. En attendant, la commande et l'assistant .bat restent disponibles.`)); }

async function accueil() {
  vider(el("h2", {}, "Accueil"), el("p", { class: "chapeau" }, "Chaque bouton lance une commande Forge ; son journal s'affiche en bas de la page. Rien à taper : les fichiers se choisissent dans des listes ou par « Parcourir… »."));
  const outils = [["questions", "quizforge", "Questions", "Valider un classeur de questions et le convertir pour Moodle.", true],
    ["exercices", "exoforge", "Exercices", "Construire un exercice guidé, l'essayer, retrouver son paquet SCORM.", true],
    ["capsules", "capsuleforge", "Capsules", "À partir d'un diaporama narré ou d'une vidéo : transcrire, relire, traduire, faire parler, construire.", true],
    ["bilans", "diagforge", "Bilans", "Analyser les résultats d'un test Moodle : notes, questions à revoir, erreurs types.", true]];

    el("div", { class: "carte etroite" }, el("div", { class: "nom" }, "Journal des tâches"), el("p", {}, "Toutes les tâches lancées par l'atelier sont notées dans data/_atelier/journal.jsonl (date, commande, état, durée)."),
      el("button", { class: "btn second", type: "button", onclick: e => montrer("data/_atelier", e.currentTarget) }, "Dossier de l'atelier")));
}

/* caméo (webcam en médaillon dans le lecteur) : réglage écrit dans le chapitre par « capsuleforge cameo » */
function reglageCameo(c, lancer) {
  const sel = (valeurs, v) => { const s = el("select", {}, valeurs.map(([x, l]) => el("option", { value: x }, l))); s.value = String(v); if (s.selectedIndex < 0) s.selectedIndex = 0; return s; };
  const pos = sel([["bas-droite", "en bas à droite"], ["bas-gauche", "en bas à gauche"], ["haut-droite", "en haut à droite"], ["haut-gauche", "en haut à gauche"], ["aucune", "pas de caméo"]], c.position);
  const tailles = [["0.15", "petit"], ["0.22", "moyen"], ["0.3", "grand"]];
  if (!tailles.some(([x]) => +x === +c.taille)) tailles.push([String(c.taille), `${Math.round(c.taille * 100)} % de la largeur`]);
  const taille = sel(tailles, tailles.find(([x]) => +x === +c.taille)[0]), forme = sel([["rond", "rond"], ["rectangle", "rectangle"]], c.forme);
  const lTaille = el("label", {}, "Taille ", taille), lForme = el("label", {}, "Forme ", forme);
  const masquer = () => { lTaille.style.display = lForme.style.display = pos.value === "aucune" ? "none" : ""; }; masquer();
  const appliquer = () => { masquer(); lancer("capsule.cameo", pos.value === "aucune" ? { position: "aucune" } : { position: pos.value, taille: taille.value, forme: forme.value }); };
  [pos, taille, forme].forEach(s => s.onchange = appliquer);
  return el("div", { class: "bloc" }, el("div", { class: "sous" }, `Caméo (webcam en médaillon, ${c.pas} pas) :`),
    el("label", {}, "Place ", pos), lTaille, lForme,
    el("div", { class: "sous" }, "Pris en compte au prochain « Construire » ; l'élève peut le masquer (bouton « Caméo »)."));
}

/* ---------- filmer l'écran (et enregistrer une manipulation) : panneau d'enregistrement ---------- */
async function formulaireFilmer(nom, d) {
  const dlg = dialogue("Filmer l'écran", [el("p", { class: "sous" }, "Recherche des écrans, caméras et micros…")], "Démarrer", async () => false);
  const a = await api("/api/appareils");
  const corps = [];
  const ecran = el("select", {}, (a.ecrans || ["n° 1"]).map((e, k) => el("option", { value: String(k + 1) }, e)));
  ecran.value = opt("f_ecran", "1"); if (ecran.selectedIndex < 0) ecran.selectedIndex = 0;
  const micro = el("select", {}, (a.micros || []).map(m => el("option", { value: m }, m)), el("option", { value: "-" }, "sans micro"));
  micro.value = opt("f_micro", (a.micros || [])[0] || "-"); if (micro.selectedIndex < 0) micro.selectedIndex = 0;
  const camera = el("select", {}, el("option", { value: "" }, "sans caméra"), (a.cameras || []).map(c => el("option", { value: c }, c)));
  camera.value = opt("f_camera", ""); if (camera.selectedIndex < 0) camera.selectedIndex = 0;
  const partie = el("select", {}, d.parties.filter(p => p.type !== "exercice").map(p => el("option", { value: p.id }, `${p.nom}  ${p.titre}`)));
  const section = el("select", {}), titre = el("input", { type: "text", placeholder: "titre de la nouvelle section" }), titreL = champ("Titre", titre);
  const majS = () => { const p = d.parties.find(x => x.id === partie.value); section.replaceChildren(el("option", { value: "" }, "nouvelle section"), ...p.sections.map(s => el("option", { value: s.id }, `${s.nom}  ${s.titre}`))); titreL.hidden = false; };
  partie.onchange = majS; section.onchange = () => titreL.hidden = !!section.value; majS();
  const mesure = el("div", { class: "mesure", hidden: true }, el("div", { class: "jauge" }, el("div", { class: "niveau" })), el("span", { class: "sous" }));
  const tester = el("button", { class: "btn second petit", type: "button", title: "Écouter le micro 4 s et donner le niveau de la voix", onclick: async () => {
    if (micro.value === "-") return;
    tester.disabled = true; mesure.hidden = false; mesure.className = "mesure"; mesure.lastChild.textContent = "Parlez normalement pendant 4 s…"; mesure.querySelector(".niveau").style.width = "0";
    const r = await api("/api/tester_micro", { micro: micro.value, essai: !!window.FORGE_ESSAI }); tester.disabled = false;
    if (!r.ok) { mesure.lastChild.textContent = r.message || "Test impossible."; mesure.classList.add("ko"); return; }
    mesure.querySelector(".niveau").style.width = Math.max(2, Math.min(100, (r.voix + 60) / 60 * 100)) + "%";
    mesure.classList.add(r.avis === "bon" ? "ok" : r.avis === "faible" ? "moyen" : "ko");
    mesure.lastChild.textContent = `Voix ${String(r.voix).replace("-", "−")} dBFS : ${r.avis}` + (r.conseil ? ` — ${r.conseil}.` : ".");
  } }, "Tester");
  micro.addEventListener("change", () => { mesure.hidden = true; tester.disabled = micro.value === "-"; });
  if (!a.ok) corps.push(el("p", { class: "erreur" }, a.message || "Appareils introuvables."));
  corps.push(champ("Écran filmé", ecran), champ("Micro", el("span", { class: "avec-bouton" }, micro, tester)), mesure, champ("Caméra (médaillon)", camera), champ("Partie", partie), champ("Section", section), titreL,
    el("p", { class: "sous" }, "Départ 3 s après « Démarrer ». Ensuite, dans n'importe quelle fenêtre : Ctrl+Maj+P pause ou reprise, Ctrl+Maj+F fin ; ou les boutons du panneau. Si cette page est sur l'écran filmé, réduisez-la : les raccourcis suffisent."));
  const dlg2 = dialogue("Filmer l'écran", corps, "Démarrer", async () => {
    garder("f_ecran", ecran.value); garder("f_micro", micro.value); garder("f_camera", camera.value);
    const id = await lancerTache("capsule.filmer", { capsule: nom, partie: partie.value, section: section.value, titre: titre.value, ecran: ecran.value,
      micro: micro.value === "-" ? "" : micro.value, sans_micro: micro.value === "-", webcam: camera.value, essai: !!window.FORGE_ESSAI });
    if (!id) return false;
  });
  dlg.close();
}
let PANNEAU = null;
function panneauEnregistrement(t) {
  if (!t || t.etat !== "en_cours" || !["filmer", "enregistrer"].includes(t.genre)) { if (PANNEAU && (!t || PANNEAU.dataset.tache === t.id)) { PANNEAU.remove(); PANNEAU = null; } return; }
  if (!PANNEAU || PANNEAU.dataset.tache !== t.id) {
    if (PANNEAU) PANNEAU.remove();
    PANNEAU = el("div", { class: "panneau-rec", role: "region", "aria-label": "Enregistrement" });
    PANNEAU.dataset.tache = t.id; document.body.append(PANNEAU);
  }
  const parti = t.rec !== "pret", pause = t.rec === "pause";
  const etat = !parti ? "Préparation…" : pause ? "⏸ En pause" : "● Enregistrement";
  const manip = t.genre === "enregistrer", envoyer = ligne => api("/api/envoyer", { id: t.id, ligne });
  PANNEAU.replaceChildren(el("div", { class: "rec-etat" + (parti && !pause ? " actif" : "") }, manip && parti && !pause ? "● Manipulation" : etat, el("span", { class: "sous" }, " · " + duree(t.duree))),
    el("div", { class: "actions" },
      manip ? el("button", { class: "btn second", type: "button", disabled: !parti || pause, title: "Ctrl+Maj+E", onclick: () => envoyer("etape") }, "Nouvelle étape") : null,
      el("button", { class: "btn second", type: "button", disabled: !parti, title: "Ctrl+Maj+P", onclick: () => envoyer("pause") }, pause ? "Reprendre" : "Pause"),
      el("button", { class: "btn", type: "button", disabled: !parti, title: "Ctrl+Maj+F", onclick: () => envoyer("fin") }, "Fin")),
    el("p", { class: "sous" }, (manip ? "Chaque clic et chaque saisie deviennent un pas. " : "") + "Dans n'importe quelle fenêtre : "
      + (manip ? "Ctrl+Maj+E nouvelle étape, " : "") + "Ctrl+Maj+P pause ou reprise, Ctrl+Maj+F fin (Ctrl et Maj ensemble)."));
}

/* ---------- tâches ---------- */
let TACHES = [], CHOISIE = null, LUES = {}, SUIVI = null;
const ICONES = { en_cours: "⟳", reussie: "✓", echec: "✗", arretee: "■" };
const LIBELLES = { en_cours: "en cours", reussie: "terminée", echec: "en échec", arretee: "arrêtée" };
async function rafraichir() {
  const d = await api("/api/taches"); if (!d.ok) return;
  const avant = Object.fromEntries(TACHES.map(t => [t.id, t.etat])); TACHES = d.taches;
  for (const t of TACHES) if (avant[t.id] === "en_cours" && t.etat !== "en_cours") {
    message(`${t.etat === "reussie" ? "Terminé" : t.etat === "echec" ? "Échec" : "Arrêté"} : ${t.titre}`, t.etat === "echec");
    if (ECRAN === "exercices" && t.outil === "exoforge") exercices();
    if (t.etat === "reussie" && t.liens && t.liens.capsule) garder("capsule", t.liens.capsule);
    if (t.etat === "reussie" && SUITES[t.id]) { const f = SUITES[t.id]; delete SUITES[t.id]; setTimeout(f, 300); }
    if (ECRAN === "capsules" && t.outil === "capsuleforge") capsules();
    if (ECRAN === "questions" && t.outil === "quizforge") questions();
    if (ECRAN === "bilans" && t.outil === "diagforge") bilans();
  }
  if (!CHOISIE && TACHES.length) CHOISIE = TACHES.at(-1).id;
  $("nb-taches").textContent = TACHES.filter(t => t.etat === "en_cours").length ? TACHES.filter(t => t.etat === "en_cours").length + " en cours" : String(TACHES.length);
  $("liste-taches").replaceChildren(...[...TACHES].reverse().map(t => el("button", { type: "button", class: "tache", role: "option", "aria-selected": String(t.id === CHOISIE), onclick: () => { CHOISIE = t.id; rafraichir(); } },
    el("span", { class: "icone" + (t.etat === "en_cours" ? " tourne" : ""), style: `color:${t.etat === "reussie" ? "var(--ok)" : t.etat === "echec" ? "var(--ko)" : "var(--texte2)"}` }, ICONES[t.etat]),
    el("span", {}, t.titre, el("span", { class: "duree" }, LIBELLES[t.etat] + " · " + duree(t.duree))))));
  await journal();
  const rec = TACHES.filter(x => ["filmer", "enregistrer"].includes(x.genre)).at(-1);
  panneauEnregistrement(rec);
}
async function journal() {
  const t = TACHES.find(x => x.id === CHOISIE); const pre = $("journal");
  if (!t) return;
  if (pre.dataset.tache !== t.id) { pre.dataset.tache = t.id; pre.textContent = ""; LUES[t.id] = 0; }
  if ((LUES[t.id] || 0) < t.lignes) {
    const d = await api(`/api/tache/${t.id}?depuis=${LUES[t.id] || 0}`);
    if (d.ok) { const bas = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30; pre.append(d.nouvelles.join("\n") + (d.nouvelles.length ? "\n" : "")); LUES[t.id] = d.depuis + d.nouvelles.length; if (bas) pre.scrollTop = pre.scrollHeight; }
  }
  const o = $("outils-tache");
  o.replaceChildren(...[el("span", { class: "etat" }, `${ICONES[t.etat]} ${t.titre}`), el("span", { class: "pastille " + (t.etat === "reussie" ? "p-ok" : t.etat === "echec" ? "p-ko" : "p-neutre") }, LIBELLES[t.etat] + " · " + duree(t.duree)),
    t.etat === "en_cours" ? el("button", { class: "btn second", type: "button", onclick: async () => { await api("/api/arreter", { id: t.id }); rafraichir(); } }, "Arrêter") : null,
    t.liens && t.liens.essayer ? el("button", { class: "btn", type: "button", onclick: () => essayer(t.liens.essayer, true) }, "Essayer l'exercice") : null,
    t.liens && t.liens.paquet ? el("button", { class: "btn second", type: "button", onclick: e => montrer(t.liens.paquet, e.currentTarget) }, "Montrer le paquet SCORM") : null,
    t.liens && t.liens.fiche ? el("button", { class: "btn", type: "button", onclick: e => ouvrir(t.liens.fiche, e.currentTarget) }, "Fiche du professeur") : null,
    t.liens && t.liens.classeur && t.outil === "diagforge" ? el("button", { class: "btn second", type: "button", onclick: e => ouvrir(t.liens.classeur, e.currentTarget) }, "Classeur du bilan") : null,
    t.liens && t.liens.classeur && t.outil === "quizforge" ? el("button", { class: "btn", type: "button", onclick: e => ouvrir(t.liens.classeur, e.currentTarget) }, "Ouvrir le classeur") : null,
    t.liens && t.liens.plan ? el("button", { class: "btn second", type: "button", onclick: e => ouvrir(t.liens.plan, e.currentTarget) }, "Plan de séance") : null,
    t.liens && t.liens.dossier ? el("button", { class: "btn second", type: "button", onclick: e => montrer(t.liens.dossier, e.currentTarget) }, "Dossier des sorties") : null,
    t.liens && t.liens.lecteur ? el("button", { class: "btn", type: "button", onclick: () => window.open(t.liens.lecteur, "_blank", "noopener") }, "Ouvrir le lecteur") : null,
    t.liens && t.liens.ouvrir && t.etat === "en_cours" ? el("button", { class: "btn", type: "button", onclick: () => window.open(t.liens.ouvrir, "_blank") }, "Revenir à l'écran") : null].filter(Boolean));
}
function deplier() { $("taches").classList.remove("replie"); $("replier").textContent = "Replier ▾"; $("replier").setAttribute("aria-expanded", "true"); }
$("replier").onclick = () => { const r = $("taches").classList.toggle("replie"); $("replier").textContent = r ? "Déplier ▴" : "Replier ▾"; $("replier").setAttribute("aria-expanded", String(!r)); };
SUIVI = setInterval(rafraichir, 1000);

$("theme").onclick = async () => { const nouveau = document.documentElement.dataset.theme === "nuit" ? "jour" : "nuit"; choisirTheme(nouveau);
  const r = await api("/api/reglages", { reglages: { apparence: nouveau } }); if (r.ok) REGLAGES = r.reglages; };

};

/* ---------- départ ---------- */
if (!JETON) vider(el("h2", {}, "AtelierForge"), el("p", { class: "chapeau" }, "Cette page doit être ouverte par Forge.bat (double-clic à la racine du dépôt)."));
else { let e = "accueil"; try { e = sessionStorage.getItem("forge-ecran") || "accueil"; } catch (x) {} chargerCours().then(() => aller(ecrans[e] ? e : "accueil")); rafraichir(); }
