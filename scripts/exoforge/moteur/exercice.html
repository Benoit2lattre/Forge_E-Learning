<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITRE__</title>
<style>
__STYLE__
</style>
</head>
<body>
<header><h1 id="titre"></h1><p id="cours"></p></header>
<main id="main">
  <aside class="panneau gauche" id="rappel" aria-label="Rappel"></aside>
  <section aria-label="Exercice" id="zone"></section>
</main>
<footer id="pied"></footer>

<div id="spot" aria-hidden="true"></div>
<script id="config" type="application/json">__CONFIG__</script>
<script>
"use strict";
const CFG = JSON.parse(document.getElementById('config').textContent);
const AUTEUR = CFG.auteur_mode || /[?&]auteur\b/.test(location.search);
const AUDIOS = CFG.audios || {};            // slot -> chemin du fichier audio
const TRANSCRIPTIONS = CFG.transcriptions || {};
const REPERES = CFG.reperes || {};          // slot -> [secondes] (fichiers <slot>.reperes.json)

/* ---------- MathJax (embarqué), macros de l'auteur ---------- */
window.MathJax = {
  tex: {packages: {'[+]': ['ams', 'color', 'mathtools']}, macros: CFG.latex_macros || {},
        inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']]},
  svg: {fontCache: 'global'},
  startup: {typeset: false, ready(){ MathJax.startup.defaultReady();
    const c = CFG.latex_couleurs || {};
    const defs = Object.entries(c).map(([n, h]) => `\\definecolor{${n}}{RGB}{${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}}`).join('');
    if(defs) MathJax.tex2svg(defs);
    MathJax.startup.promise.then(()=>{ maths(document.body); });
  }}
};
let filMath = Promise.resolve();
function maths(noeud){
  if(!window.MathJax || !MathJax.typesetPromise) return;
  filMath = filMath.then(()=>MathJax.typesetPromise([noeud])).then(()=>{
    if(AUTEUR) noeud.querySelectorAll('mjx-container [data-mjx-error]').forEach(e=>{
      e.closest('mjx-container').title='Erreur LaTeX : '+e.getAttribute('data-mjx-error'); });
  }).catch(e=>console.warn(e));
}

/* ---------- Outils ---------- */
function el(tag, attrs, ...enfants){
  const e = document.createElement(tag);
  for(const k in (attrs||{})) e.setAttribute(k, attrs[k]);
  enfants.flat().forEach(x => e.append(x instanceof Node ? x : document.createTextNode(x)));
  return e;
}
function html(tag, attrs, contenu){ const e = el(tag, attrs); e.innerHTML = contenu; return e; }
// texte riche : **gras**, *italique*, retours à la ligne ; les formules $…$ sont laissées à MathJax
function riche(t){
  return String(t||'').trim()
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<em>$2</em>')
    .replace(/\n{2,}/g,'</p><p>');
}
function formule(tex, affichee){ return affichee ? '$$'+tex+'$$' : '$'+tex+'$'; }
function melanger(a, graine){ let s=graine||Date.now(); const r=()=>(s=(s*9301+49297)%233280)/233280;
  const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function lettre(k){ return String.fromCharCode(97+k); }

/* ---------- Données tirées, expressions {=…} ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function fmt(x){
  if(Array.isArray(x)) return x.map(fmt).join(', ');
  if(typeof x !== 'number') return String(x);
  if(Number.isInteger(x)) return x.toLocaleString('fr-FR');
  return Number(x.toPrecision(4)).toLocaleString('fr-FR',{maximumFractionDigits:6});
}
const OUTILS = {sum:a=>a.reduce((x,y)=>x+y,0), prod:a=>a.reduce((x,y)=>x*y,1), round:Math.round, floor:Math.floor,
  ceil:Math.ceil, abs:Math.abs, min:Math.min, max:Math.max, log10:Math.log10, ln:Math.log, exp:Math.exp, sqrt:Math.sqrt,
  pow:Math.pow, pi:Math.PI, fmt};
let VARS = {};                                  // données de l'exercice (tirées puis calculées) et choix de parcours
function evaluer(expr, loc){
  if(typeof expr === 'number' || typeof expr === 'boolean') return expr;
  const ctx = Object.assign({}, OUTILS, VARS, loc||{}), k = Object.keys(ctx);
  try{ return Function(...k, '"use strict";return ('+expr+');')(...k.map(x=>ctx[x])); }
  catch(e){ if(AUTEUR) console.warn('Expression « '+expr+' » :', e.message); return undefined; }
}
const vrai = (si, loc) => si === undefined || si === null || !!evaluer(si, loc);
function tpl(t, loc){ return typeof t !== 'string' ? t : t.replace(/\{=([^{}]+)\}/g, (m, e) => { const v = evaluer(e, loc); return v === undefined ? m : fmt(v); }); }
// champs qui sont des expressions ou des réglages : jamais remplacés comme du texte
const BRUTS = new Set(['attendu','si','correct','repeter','graphique','pose','aller_a','id','audio','type','tolerance',
  'tentatives','points_par_tentative','apparait','mises_en_evidence','note','type_scorm']);
function tplObj(o, loc){
  if(typeof o === 'string') return tpl(o, loc);
  if(Array.isArray(o)) return o.map(x => tplObj(x, loc));
  if(o && typeof o === 'object'){ const r = {}; for(const k in o) r[k] = BRUTS.has(k) ? o[k] : tplObj(o[k], loc); return r; }
  return o;
}
const PARAMS = new URLSearchParams(location.search);
let ESSAI = 0, MODE = 'aleatoire';
const idI = base => base + (ESSAI > 1 ? '_t'+ESSAI : '');
function tirer(graine){
  const T = CFG.donnees; VARS = {};
  if(!T) return;
  const r = mulberry32(graine), fixe = MODE === 'fixe' ? (T.fixe || {}) : {};
  for(let essai = 0; essai < 500; essai++){
    VARS = JSON.parse(JSON.stringify(T.constantes || {}));
    if(MODE !== 'fixe') for(const [nom, t] of Object.entries(T.tirage || {})){
      const un = () => t.parmi ? t.parmi[Math.floor(r()*t.parmi.length)]
        : (t.pas ? t.min + Math.floor(r()*(Math.round((t.max-t.min)/t.pas)+1))*t.pas : t.min + r()*(t.max-t.min));
      VARS[nom] = t.nombre ? Array.from({length:t.nombre}, un) : un();
    }
    Object.assign(VARS, JSON.parse(JSON.stringify(fixe)));
    for(const [nom, e] of Object.entries(T.calculs || {})) if(!(nom in fixe)) VARS[nom] = evaluer(e);
    if(MODE === 'fixe' || !T.rejeter_si || !evaluer(T.rejeter_si)) break;
  }
}

/* ---------- Graphique calculé (courbes, points, pointillés de lecture) ---------- */
const ETAT_G = {actif:-1, lecture:new Set(), revele:new Set(), montre:new Set()};
const svgT = t => String(t).replace(/<sub>(.*?)<\/sub>/g,'<tspan font-size="9" dy="3">$1</tspan><tspan dy="-3"> </tspan>')
                          .replace(/<sup>(.*?)<\/sup>/g,'<tspan font-size="9" dy="-6">$1</tspan><tspan dy="6"> </tspan>');
function dessinerGraphique(G){
  // bornes et pas des axes : nombres ou expressions (ex. max: "Rm")
  const axe = a => Object.assign({}, a, {min: evaluer(a.min), max: evaluer(a.max), pas: a.pas === undefined ? undefined : evaluer(a.pas)});
  const W = G.largeur||540, H = G.hauteur||330, g = 56, d = 18, h = 16, b = 44, ax = axe(G.x), ay = axe(G.y);
  const tx = v => ax.log ? Math.log10(v) : v, ty = v => ay.log ? Math.log10(v) : v;
  const X = v => g + (tx(v)-tx(ax.min))/(tx(ax.max)-tx(ax.min))*(W-g-d);
  const Y = v => h + (ty(ay.max)-ty(v))/(ty(ay.max)-ty(ay.min))*(H-h-b);
  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${(G.alt||'').replace(/"/g,'&quot;')}">`;
  o += `<defs><clipPath id="zone-${G.id}"><rect x="${g}" y="${h}" width="${W-g-d}" height="${H-h-b}"/></clipPath></defs>`;
  const grille = (a, vert) => {
    const ligne = (v, fort) => vert ? `<line x1="${X(v)}" y1="${h}" x2="${X(v)}" y2="${H-b}" stroke="${fort?'#bbb':'#e6e6e6'}"/>`
                                    : `<line x1="${g}" y1="${Y(v)}" x2="${W-d}" y2="${Y(v)}" stroke="${fort?'#ccc':'#eee'}"/>`;
    const lab = (v, txt) => vert ? `<text x="${X(v)}" y="${H-b+18}" font-size="12" text-anchor="middle" fill="#333">${txt}</text>`
                                 : `<text x="${g-8}" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="#333">${txt}</text>`;
    let r = '';
    if(a.log){ const e0 = Math.floor(Math.log10(a.min)+1e-9), e1 = Math.ceil(Math.log10(a.max)-1e-9);
      for(let e = e0; e <= e1; e++){ for(let m = 1; m < 10; m++){ const v = m*10**e; if(v < a.min*0.999 || v > a.max*1.001) continue; r += ligne(v, m===1); }
        if(10**e >= a.min*0.999 && 10**e <= a.max*1.001) r += lab(10**e, `10<tspan dy="-6" font-size="9">${e}</tspan>`); } }
    else { const pas = a.pas || (a.max-a.min)/5; for(let v = a.min; v <= a.max+1e-9; v += pas){ r += ligne(v, true) + lab(v, fmt(+v.toPrecision(6))); } }
    return r;
  };
  o += grille(ax, true) + grille(ay, false);
  o += `<text x="${(g+W-d)/2}" y="${H-6}" font-size="12" text-anchor="middle" fill="#333">${svgT(ax.titre||'')}</text>`;
  o += `<text x="14" y="${(h+H-b)/2}" font-size="12" text-anchor="middle" fill="#333" transform="rotate(-90 14 ${(h+H-b)/2})">${svgT(ay.titre||'')}</text>`;
  o += `<g clip-path="url(#zone-${G.id})">`;
  (G.courbes||[]).forEach(c => {
    if(c.cachee && !ETAT_G.montre.has(c.id)) return;      // courbe montrée par une étape (graphique: {montre: id})
    const pts = [];
    for(let q = 0; q <= 200; q++){
      const u = tx(ax.min) + q/200*(tx(ax.max)-tx(ax.min)), x = ax.log ? 10**u : u, y = evaluer(c.y, {x});
      if(typeof y === 'number' && isFinite(y)) pts.push(X(x).toFixed(1)+','+Y(y).toFixed(1));
    }
    const coul = c.couleur || (c.pointilles ? 'var(--principal)' : 'var(--graphique,#470A68)'), ep = c.epaisseur || (c.pointilles ? 1.5 : 3);
    o += `<polyline id="${c.id||''}" points="${pts.join(' ')}" fill="none" style="stroke:${coul}" stroke-width="${ep}"${c.pointilles ? ' stroke-dasharray="6 4"' : ''}/>`;
    if(c.etiquette && pts.length){ const [lx, ly] = pts[Math.floor(pts.length*(c.position_etiquette ?? 0.15))].split(',');
      o += `<text x="${+lx+6}" y="${+ly-6}" font-size="12" style="fill:${coul}">${svgT(tpl(c.etiquette))}</text>`; }
  });
  o += '</g>';
  let base = 0;                                        // séries de points : numéros continus d'une série à l'autre
  [].concat(G.points || []).forEach(P => {
    const xs = [].concat(evaluer(P.x) || []), ys = [].concat(evaluer(P.y) || []), lx = P.lecture ? [].concat(evaluer(P.lecture.x) || []) : null;
    const coulP = P.couleur || 'var(--points,#B3161B)';
    xs.forEach((xv, jj) => {
      const j = base + jj;
      if(P.apparait === 'revele' && !ETAT_G.revele.has(j)) return;   // point affiché une fois calculé
      const yv = ys[jj], xn = X(xv), yn = Y(yv);
      if(lx && (ETAT_G.lecture.has(j) || ETAT_G.revele.has(j))){
        const xN = X(lx[jj]);
        o += `<path d="M${g} ${yn} H${xN} V${H-b}" fill="none" style="stroke:var(--principal)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
        if(ETAT_G.revele.has(j) && P.lecture.etiquette) o += `<text x="${xN+5}" y="${H-b-6}" font-size="12" style="fill:var(--principal)">${svgT(tpl(P.lecture.etiquette, {j}))}</text>`;
      }
      o += `<g id="${(P.id||'point')+(j+1)}">`;
      if(j === ETAT_G.actif) o += `<circle cx="${xn}" cy="${yn}" r="15" fill="#fff" style="stroke:var(--principal)" stroke-width="2"/>`;
      if(P.marque !== false) o += `<path d="M${xn} ${yn-9} L${xn+3} ${yn-3} L${xn+9} ${yn} L${xn+3} ${yn+3} L${xn} ${yn+9} L${xn-3} ${yn+3} L${xn-9} ${yn} L${xn-3} ${yn-3} Z" style="fill:${coulP}"/>`;
      if(P.etiquette){ const gch = P.position_etiquette === 'gauche';            // droite (défaut) | gauche
        const dx = P.marque === false ? 0 : 11, ya = P.marque === false ? yn+4 : yn-8;
        o += `<text x="${gch ? xn-dx : xn+dx}" y="${ya}" font-size="${P.marque === false ? 12 : 11}" text-anchor="${gch ? 'end' : 'start'}" style="fill:${coulP}">${svgT(tpl(P.etiquette, {j: jj}))}</text>`; }
      o += '</g>';
    });
    base += xs.length;
  });
  return o + '</svg>';
}
const GRAPHIQUES_ETAPES = [];                           // graphiques posés dans les étapes (bloc « graphique »)
function majGraphique(){ const G = CFG.rappel && CFG.rappel.graphique, e = G && document.getElementById('rappel-'+G.id); if(e) e.innerHTML = dessinerGraphique(G);
  GRAPHIQUES_ETAPES.forEach(({G, e}) => { e.innerHTML = dessinerGraphique(G); }); }
function descriptionGraphique(G){
  if(!G.description) return null;
  const D = typeof G.description === 'string' ? {texte: G.description} : G.description;
  const d = el('details',{class:'acces'}); d.append(el('summary',{},'Description textuelle du graphique'), html('p',{}, tpl(D.texte||'')));
  if(LECTURE_VOCALE()){ const b = el('button',{type:'button', class:'ecouter'},'🔊 Écouter'); b.onclick = () => parler(D.voix ? tpl(D.voix) : versVoix(d.querySelector('p'))); d.append(b); }
  return d;
}
function appliquerGraphique(a, loc){
  // a : {si, actif, lecture, revele} — lecture / revele ajoutent un ou plusieurs numéros de points
  if(!a || !vrai(a.si, loc)) return;
  if('actif' in a){ const v = evaluer(a.actif, loc); ETAT_G.actif = (v === undefined || v === null) ? -1 : v; }
  if(a.montre !== undefined) [].concat(a.montre).forEach(id => ETAT_G.montre.add(String(id)));   // noms de courbes, tels quels
  ['lecture','revele'].forEach(c => { if(a[c] !== undefined) [].concat(evaluer(a[c], loc)).forEach(j => { if(j !== undefined && j !== null) ETAT_G[c].add(j); }); });
  majGraphique();
}

/* ---------- Mise en évidence (cadre lumineux) et lecture vocale ---------- */
const SPOT = () => document.getElementById('spot');
let cibleSpot = null;
const cibleEl = c => c && (document.getElementById(c) || document.getElementById('rappel-'+c));
function placerSpot(){
  const e = cibleEl(cibleSpot), sp = SPOT();
  if(!sp) return;
  if(!e){ sp.style.display = 'none'; return; }
  const r = e.getBoundingClientRect(), m = 10;
  Object.assign(sp.style, {display:'block', left:(r.left-m)+'px', top:(r.top-m)+'px', width:(r.width+2*m)+'px', height:(r.height+2*m)+'px'});
}
function viserSpot(c){ if(c === cibleSpot) return; cibleSpot = c; const e = cibleEl(c); if(e) e.scrollIntoView({behavior:'smooth', block:'nearest'}); placerSpot(); }
window.addEventListener('scroll', placerSpot, {passive:true}); window.addEventListener('resize', placerSpot);
document.addEventListener('scroll', placerSpot, {passive:true, capture:true});
function versVoix(noeud){
  const k = noeud.cloneNode(true);
  k.querySelectorAll('button,input,.lecteur,.auteur,.tentatives,mjx-assistive-mml').forEach(x => x.remove());
  k.querySelectorAll('sup').forEach(x => x.replaceWith(' puissance '+x.textContent+' '));
  k.querySelectorAll('sub').forEach(x => x.replaceWith(' '+x.textContent));
  return k.textContent.replace(/σ\s*a/g,'sigma a').replace(/σ/g,'sigma').replace(/MPa/g,' mégapascals')
          .replace(/(\d)\s*\/\s*(\d)/g,'$1 sur $2').replace(/ \/ /g,' sur ').replace(/\s+/g,' ').trim();
}
function parler(texte){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel(); if(EN_COURS) EN_COURS.pause();
  const u = new SpeechSynthesisUtterance(texte); u.lang = 'fr-FR';
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('fr')); if(v) u.voice = v;
  speechSynthesis.speak(u);
}
const LECTURE_VOCALE = () => !!((CFG.accessibilite||{}).lecture_vocale && 'speechSynthesis' in window);

/* ---------- SCORM 1.2 (fonctionne aussi hors LMS) ---------- */
const SCORM = (() => {
  let api=null, n=0; const debut=Date.now();
  function trouver(w){ let k=0; while(w && !w.API && w.parent && w.parent!==w && k++<10) w=w.parent; return w && w.API; }
  try{ api = trouver(window) || (window.opener && trouver(window.opener)) || null; }catch(e){ api=null; }
  const set=(k,v)=>{ if(api) api.LMSSetValue(k,String(v)); else if(AUTEUR) console.log('[SCORM]',k,'=',v); };
  return {
    init(){ if(api){ api.LMSInitialize(''); const st=api.LMSGetValue('cmi.core.lesson_status');
      if(st==='not attempted'||st==='') set('cmi.core.lesson_status','incomplete'); } },
    interaction(id,type,rep,res,cor){ const p='cmi.interactions.'+(n++)+'.';
      set(p+'id',id); set(p+'type',type); set(p+'student_response',rep); set(p+'result',res);
      if(cor!==undefined) set(p+'correct_responses.0.pattern',cor); if(api) api.LMSCommit(''); },
    score(pc){ set('cmi.core.score.min',0); set('cmi.core.score.max',100); set('cmi.core.score.raw',Math.round(pc)); if(api) api.LMSCommit(''); },
    terminer(pc){ this.score(pc); set('cmi.core.lesson_status','completed');
      const s=Math.round((Date.now()-debut)/1000), h=String(Math.floor(s/3600)).padStart(4,'0'),
            m=String(Math.floor(s%3600/60)).padStart(2,'0'), ss=String(s%60).padStart(2,'0');
      set('cmi.core.session_time',h+':'+m+':'+ss); if(api) api.LMSCommit(''); },
    fermer(){ if(api){ try{ api.LMSFinish(''); }catch(e){} api=null; } }
  };
})();
window.addEventListener('beforeunload',()=>SCORM.fermer());

/* ---------- Encadré permanent ---------- */
const RAP = CFG.rappel;
let boiteModele = null;
function construireRappel(){
  const box = document.getElementById('rappel');
  if(!RAP){ box.remove(); document.getElementById('main').classList.add('sans-rappel'); return; }
  box.innerHTML = '';
  if(RAP.titre) box.append(el('h2',{},tpl(RAP.titre)));
  if(RAP.texte) box.append(html('div',{class:'texte', id:'rappel-texte'}, '<p>'+riche(tpl(RAP.texte))+'</p>'));
  if(RAP.image) box.append(el('img',{src:RAP.image, alt: RAP.image_alt || ''}));
  const T = RAP.tableau;
  if(T){
    const t = el('table',{class:'donnees', id:'rappel-'+(T.id||'tableau')});
    t.append(html('tr',{}, (T.entetes||[]).map(x=>'<th>'+tpl(x)+'</th>').join('')));
    [].concat(evaluer(T.lignes) || []).forEach(l => t.append(html('tr',{}, [].concat(l).map(x=>'<td>'+fmt(x)+'</td>').join(''))));
    box.append(t);
  }
  const G = RAP.graphique;
  if(G){
    box.append(html('div',{class:'graphique', id:'rappel-'+G.id}, dessinerGraphique(G)));
    if(G.description){
      const D = typeof G.description === 'string' ? {texte: G.description} : G.description;
      const d = el('details',{class:'acces'}); d.append(el('summary',{},'Description textuelle du graphique'), html('p',{}, tpl(D.texte||'')));
      if(LECTURE_VOCALE()){ const b = el('button',{type:'button', class:'ecouter'},'🔊 Écouter'); b.onclick = () => parler(D.voix ? tpl(D.voix) : versVoix(d.querySelector('p'))); d.append(b); }
      box.append(d);
    }
    if(G.lecteur){
      const Lc = G.lecteur, d = el('details',{class:'acces'}); d.append(el('summary',{}, Lc.titre || 'Lire la courbe pour une valeur donnée'));
      const inp = el('input',{type:'text', inputmode:'decimal', 'aria-label': Lc.invite||'Valeur', placeholder: Lc.invite||''});
      const out = el('p',{'aria-live':'polite'}), b = el('button',{type:'button'},'Lire');
      b.onclick = () => { const v = lireNombre(inp.value); if(isNaN(v)){ out.textContent = 'Entrez un nombre.'; return; }
        const r = evaluer(Lc.calcul, {v}), t = tpl(Lc.reponse || '{=r}', {v, r}); out.innerHTML = t; if(LECTURE_VOCALE()) parler(versVoix(out));
        SCORM.interaction(idI('lecteur'), 'numeric', String(v), 'neutral'); };
      const l = el('div',{class:'saisie'}); l.append(inp, b); d.append(l, out); box.append(d);
    }
  }
  (RAP.formules||[]).forEach(f => box.append(html('div',{class:'rappel-f', id:'rappel-'+(f.id||'')}, formule(f.tex||f, true))));
  if(RAP.modele){
    boiteModele = el('div',{class:'modele', id:'rappel-modele', 'aria-live':'polite'});
    boiteModele.append(html('h3',{},RAP.modele.titre || 'Modèle'), el('div',{class:'vide'},'Se complète au fil des questions.'));
    box.append(boiteModele);
  }
}
function focus(id){
  const e = id==='modele' ? boiteModele : document.getElementById('rappel-'+id);
  if(!e) return; e.classList.add('focus'); e.scrollIntoView({behavior:'smooth', block:'nearest'});
  setTimeout(()=>e.classList.remove('focus'), 2600);
}
function ajouterAuRappel(a){
  // a : {tex: "…" ou ["…", "…"], texte: "…" (facultatif), bloc: modele, remplace: true, apres: id, exergue: true}
  if(!a) return;
  const texs = Array.isArray(a.tex) ? a.tex : (a.tex ? [a.tex] : []);
  const ligne = el('div',{class:'rappel-f'+(a.exergue?' exergue':'')});
  if(a.texte) ligne.append(html('p',{}, riche(a.texte)));
  texs.forEach(t => ligne.append(html('div',{}, formule(t, true))));
  const cible = a.apres ? null : boiteModele;
  if(cible){
    cible.querySelector('.vide')?.remove();
    const lignes = cible.querySelectorAll('.rappel-f');
    if(a.remplace && lignes.length) lignes[lignes.length-1].replaceWith(ligne); else cible.append(ligne);
    maths(ligne); focus('modele');
  } else {
    const apres = document.getElementById('rappel-'+(a.apres||''));
    (apres ? apres.after(ligne) : document.getElementById('rappel').append(ligne)); maths(ligne);
    ligne.classList.add('focus'); setTimeout(()=>ligne.classList.remove('focus'),2600);
  }
}

/* ---------- Audio : enregistrement de l'auteur, apparitions synchronisées ---------- */
// AUDIOS[slot] : un fichier, ou la liste des segments <slot>_a1, <slot>_a2… (découpe faite dans Audacity)
let EN_COURS = null;                                     // un seul audio à la fois
function jouer(a){ if(EN_COURS && EN_COURS !== a) EN_COURS.pause(); EN_COURS = a; return a.play().catch(()=>{}); }
function sources(slot){ const s = AUDIOS[slot]; return !s ? [] : (Array.isArray(s) ? s : [s]); }

function lecteur(slot, blocs, temps, opts){
  opts = opts || {};
  // Sans audio, ou tant que l'étudiant n'a pas lancé l'écoute, tout est visible.
  // L'écoute masque ce qui vient après et le fait apparaître à son moment :
  //  - segments : le bloc k apparaît au début du segment k (le dernier segment montre le reste) ;
  //  - fichier unique : aux temps de <slot>.reperes.json (ou « apparait » de la fiche).
  const srcs = sources(slot);
  if(!srcs.length) return {elt:null};
  const segments = srcs.length > 1;
  const tps = REPERES[slot] || temps || [];
  const audio = new Audio(srcs[0]); audio.preload = 'metadata';
  const durees = srcs.map(()=>0);
  if(segments) srcs.forEach((u,k)=>{ const a = new Audio(); a.preload='metadata'; a.onloadedmetadata=()=>{ durees[k]=a.duration||0; }; a.src=u; });
  let seg = 0, guide = false, toutVu = false, termine = false;
  const avant = k => durees.slice(0,k).reduce((x,y)=>x+y, 0);
  const atteint = k => segments ? (k <= seg || seg === srcs.length-1) : audio.currentTime >= (tps[k]||0);
  const montrer = () => blocs.forEach((b,k)=>{
    if(b.classList.contains('avenir') && (toutVu || atteint(k))){ b.classList.remove('avenir'); b.scrollIntoView({behavior:'smooth', block:'nearest'}); } });
  const lancer = () => {
    if(!guide && !toutVu){ guide = true; blocs.forEach((b,k)=>{ if(!atteint(k)) b.classList.add('avenir'); }); }
    jouer(audio);
  };
  const aller = k => { termine = false;
    if(segments){ seg = k; audio.src = srcs[k]; } else audio.currentTime = tps[k] || 0;
    lancer(); };
  const bt = el('button',{type:'button', class:'secondaire', 'aria-label':'Écouter le commentaire'},'▶ Écouter');
  const pr = el('progress',{max:'1', value:'0', 'aria-label':'Avancement du commentaire'});
  const tout = el('button',{type:'button', class:'secondaire', title:'Tout afficher sans écouter'},'Tout afficher');
  const box = el('div',{class:'lecteur'}, bt, pr);
  const nParts = segments ? srcs.length : (tps.length > 1 ? tps.length : 0);
  if(nParts > 1){                                        // revenir sur une partie du commentaire
    const pa = el('span',{class:'parties'}, 'Partie');
    for(let k = 0; k < nParts; k++){
      const b = el('button',{type:'button', class:'secondaire', 'aria-label':'Réécouter la partie '+(k+1)}, String(k+1));
      b.onclick = () => aller(k); pa.append(b);
    }
    box.append(pa);
  }
  box.append(tout);
  const st = (opts.sous_titres||[]).length ? el('div',{class:'soustitre', 'aria-live':'polite'}) : null;
  if(st) box.append(st);
  let arrete = false;
  const synchro = () => {                                // mises en évidence et sous-titres, au temps global
    if(arrete) return;
    const t = (segments ? avant(seg) : 0) + audio.currentTime;
    if((opts.spots||[]).length){ const a = opts.spots.filter(r => r.cible && t >= r.t && (r.fin === undefined || t < r.fin)).pop(); viserSpot(a ? a.cible : null); }
    if(st){ const a = opts.sous_titres.filter(r => t >= r.t).pop(); const tx = a ? a.texte : ''; if(st.textContent !== tx) st.textContent = tx; }
  };
  bt.onclick = () => { arrete = false; if(termine) aller(0); else if(audio.paused) lancer(); else audio.pause(); };
  for(const b of box.querySelectorAll('.parties button')) b.addEventListener('click', () => { arrete = false; }, true);
  audio.addEventListener('play', ()=>{ bt.textContent='❚❚ Pause'; });
  audio.addEventListener('pause', ()=>{ if(!termine) bt.textContent='▶ Reprendre'; });
  tout.onclick = () => { toutVu = true; montrer(); tout.remove(); };
  audio.addEventListener('timeupdate',()=>{
    const total = segments ? avant(srcs.length) : audio.duration;
    if(total) pr.value = ((segments ? avant(seg) : 0) + audio.currentTime) / total;
    montrer(); synchro(); });
  audio.addEventListener('ended',()=>{
    if(segments && seg < srcs.length-1){ seg++; audio.src = srcs[seg]; montrer(); jouer(audio); return; }
    termine = true; toutVu = true; bt.textContent='↺ Réécouter'; pr.value = 1; montrer(); tout.remove();
    if((opts.spots||[]).length) viserSpot(null);
    if(opts.surFin) opts.surFin(); });
  return {elt:box, audio, arreter(){ arrete = true; audio.pause(); if((opts.spots||[]).length) viserSpot(null); }};
}
// petit lecteur pour un retour ou une explication : <id>_explication, <id>_retour_<lettre>
function miniLecteur(slot){
  const srcs = sources(slot); if(!srcs.length) return null;
  let k = 0, fin = false; const a = new Audio(srcs[0]);
  const b = el('button',{type:'button', class:'secondaire mini', 'aria-label':'Écouter ce commentaire'},'▶ Écouter');
  b.onclick = () => { if(a.paused){ fin = false; jouer(a); } else a.pause(); };
  a.onplay = () => { b.textContent = '❚❚'; };
  a.onpause = () => { if(!fin) b.textContent = '▶ Reprendre'; };
  a.onended = () => { if(k < srcs.length-1){ a.src = srcs[++k]; jouer(a); } else { fin = true; k = 0; a.src = srcs[0]; b.textContent = '↺ Réécouter'; } };
  return b;
}
// effets sonores (facultatifs : profil, rubrique « sons ») ; l'étudiant peut les couper
const SONS = CFG.sons || {};
let sonsActifs = true;
try{ sonsActifs = localStorage.getItem('exoforge-sons') !== 'non'; }catch(e){}
function son(nom){ if(!sonsActifs || !SONS[nom]) return; try{ const a = new Audio(SONS[nom]); a.volume = 0.5; a.play().catch(()=>{}); }catch(e){} }
function transcription(slot){
  const t = TRANSCRIPTIONS[slot]; if(!t) return null;
  const d = el('details',{class:'transcription'}); d.append(el('summary',{},'Transcription du commentaire'), html('div',{}, '<p>'+riche(t)+'</p>'));

// Mode auteur : pointer les apparitions en écoutant l'enregistrement
function outilReperes(slot, n){
  const d = el('div',{class:'auteur'});
  const srcs = sources(slot);
  d.append(html('div',{}, `Mode auteur — emplacement audio <code>${slot}</code>`+(srcs.length?'':' (pas encore enregistré)')+` ; ${n} élément(s) à faire apparaître.`));
  if(srcs.length > 1){
    d.append(html('div',{}, `Découpe par fichiers : ${srcs.length} segment(s) (<code>${slot}_a1</code>…)`
      + (srcs.length === n ? ' — un par élément.' : ` — <strong>attention : ${n} élément(s)</strong> ; le dernier segment montre ce qui reste.`)));
    return d;
  }
  if(!srcs.length || n < 2) return d;
  const bt = el('button',{type:'button', class:'secondaire'},'Pointer les apparitions');
  const out = el('textarea',{readonly:'', 'aria-label':'Repères relevés'});
  bt.onclick = () => {
    const a = new Audio(srcs[0]); let t = [0];
    const aide = ' — Espace : marquer ; Retour arrière : annuler le dernier ; ← : reculer de 5 s';
    const afficher = () => { out.value = JSON.stringify(t) + aide; };
    const marquer = () => { t.push(+a.currentTime.toFixed(1)); afficher(); if(t.length >= n) fin(); };
    const clavier = e => {
      if(e.code==='Space'){ e.preventDefault(); marquer(); }
      else if(e.code==='Backspace'){ e.preventDefault(); if(t.length > 1){ t.pop(); afficher(); } }
      else if(e.code==='ArrowLeft'){ e.preventDefault(); a.currentTime = Math.max(0, a.currentTime - 5);
        t = t.filter(x => x <= a.currentTime || x === 0); afficher(); } };
    const fin = () => { document.removeEventListener('keydown', clavier); a.pause(); out.onclick=null; out.value = JSON.stringify(t);
      const lien = el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(t)],{type:'application/json'})), download: slot+'.reperes.json'},
                      `Enregistrer ${slot}.reperes.json`);
      d.append(el('div',{}, 'Placez ce fichier dans le dossier des médias, puis reconstruisez : ', lien));
      bt.textContent = 'Recommencer le pointage'; bt.disabled = false; };
    bt.disabled = true; afficher();
    document.addEventListener('keydown', clavier); out.onclick = marquer; a.onended = fin; jouer(a);
  };
  d.append(bt, out); return d;
}

/* ---------- Étapes ---------- */
const DEF = Object.assign({tentatives:2, points_par_tentative:[1,0.5], ordre_options:'melange', tolerance:0.02, suite:'bouton'}, CFG.defauts||{});
const zone = document.getElementById('zone');
const bilan = {points:0, max:0};

function carte(etape, plus){
  const c = el('div',{class:'carte active', id:'etape-'+etape.id});
  const t = el('div',{class:'entete'}); t.append(html('h2',{}, riche(etape.titre || '')));
  c.append(t);
  const blocs = (etape.contenu || []).map(bloc);
  if(etape.enonce) blocs.push(html('div',{class:'bloc'}, '<p>'+riche(etape.enonce)+'</p>'));
  blocs.forEach(b=>c.append(b));
  const slot = etape.audio;
  const anim = blocs.concat(plus || []);              // éléments qui apparaissent avec le commentaire
  const L = slot ? lecteur(slot, anim, etape.apparait, {spots: etape.mises_en_evidence, sous_titres: etape.sous_titres, surFin: etape.surFin}) : {elt:null};
  if(L.elt) t.append(L.elt);
  else if(LECTURE_VOCALE()){ const b = el('button',{type:'button', class:'ecouter', 'aria-label':'Écouter (synthèse vocale)'},'🔊 Écouter'); b.onclick = () => parler(versVoix(c)); t.append(b); }
  if(!L.arreter) L.arreter = () => { if(L.audio) L.audio.pause(); };
  const tr = slot && transcription(slot); if(tr) c.append(tr);
  if(AUTEUR && slot) c.append(outilReperes(slot, anim.length));
  zone.append(c); maths(c);
  if(etape.focus_rappel) focus(etape.focus_rappel);
  setTimeout(()=>c.scrollIntoView({behavior:'smooth', block:'start'}), 60);
  return {c, L};
}

function etapeChoix(etape, loc){
  return new Promise(ok => {
    etape.options = (etape.options||[]).map(o => typeof o === 'string' ? {texte:o} : o);
    const noter = etape.note !== false;
    const multi = !!etape.plusieurs, uneParUne = !!etape.options_une_par_une;
    // propositions lues une par une : ordre de la fiche, celui de l'enregistrement
    const ordre = (uneParUne || (etape.ordre_options || DEF.ordre_options) === 'fixe') ? etape.options.map((o,k)=>k)
                : melanger(etape.options.map((o,k)=>k));
    const box = el('div',{class:'choix', role: multi?'group':'radiogroup', 'aria-label': etape.titre||''});
    const lignes = ordre.map(k => {
      const o = etape.options[k];
      const inp = el('input',{type: multi?'checkbox':'radio', name:'q-'+etape.id, value:String(k)});
      const contenu = el('div',{class:'opt-texte'});
      if(o.texte) contenu.append(html('p',{}, riche(o.texte)));
      if(o.tex) contenu.append(html('div',{}, formule(o.tex, !!o.texte)));
      const lab = el('label',{}, inp, contenu);
      inp.onchange = () => { box.querySelectorAll('label').forEach(l=>l.classList.toggle('coche', l.querySelector('input').checked)); valider.disabled = !box.querySelector('input:checked'); };
      box.append(lab); return {k, o, inp, lab};
    });
    const {c, L} = carte(etape, uneParUne ? lignes.map(x=>x.lab) : []);
    if(multi) c.append(el('p',{class:'tentatives'},'Plusieurs réponses possibles.'));
    c.append(box);
    const valider = el('button',{type:'button', disabled:''},'Valider');
    const act = el('div',{class:'actions'}, valider);
    const info = el('div',{class:'tentatives', 'aria-live':'polite'});
    c.append(act, info); maths(box);
    const justes = etape.correct !== undefined ? [].concat(evaluer(etape.correct, loc)).sort()
                 : etape.options.map((o,k)=>o.correct?k:-1).filter(k=>k>=0);
    const auto = (etape.suite || DEF.suite) === 'auto';
    const quitter = (o) => { c.classList.remove('active'); L.arreter();
      if(o && o.pose) Object.assign(VARS, o.pose); ok(o && o.aller_a ? {aller_a: o.aller_a} : null); };
    const nbT = etape.tentatives || DEF.tentatives, pts = etape.points_par_tentative || DEF.points_par_tentative;
    let essai = 0; if(noter) bilan.max += 1;
    const retours = el('div',{});
    c.insertBefore(retours, act);
    info.textContent = (noter && nbT > 1) ? `${nbT} essais.` : '';
    valider.onclick = () => {
      if(!noter){                                         // question non notée : on enregistre et on passe
        const choisis = lignes.filter(x=>x.inp.checked);
        SCORM.interaction(idI(etape.id), etape.type_scorm || 'choice', choisis.map(x=>lettre(x.k)).join(','), 'neutral');
        lignes.forEach(x=>{ x.inp.disabled = true; x.lab.classList.add('bloque'); });
        valider.remove(); info.textContent = '';
        quitter(choisis.length ? choisis[0].o : null); return;
      }
      essai++;
      const choisis = lignes.filter(x=>x.inp.checked).map(x=>x.k).sort();
      const bon = choisis.length===justes.length && choisis.every((k,i)=>k===justes[i]);
      son(bon ? 'juste' : 'faux');
      SCORM.interaction(idI(etape.id)+'_'+essai, 'choice', choisis.map(lettre).join(','), bon?'correct':'wrong', justes.map(lettre).join(','));
      retours.innerHTML = '';
      if(!bon){
        // retours propres aux options choisies qui sont fausses
        lignes.filter(x=>x.inp.checked && !justes.includes(x.k) && x.o.retour).forEach(x=>{
          const r = html('div',{class:'retour faux'}, riche(x.o.retour));
          const m = miniLecteur(etape.id+'_retour_'+lettre(x.k)); if(m) r.append(m);
          retours.append(r); });
        if(multi && choisis.some(k=>justes.includes(k)) && !retours.childNodes.length)
          retours.append(el('div',{class:'retour faux'},'Une partie seulement de votre réponse est juste.'));
        if(!retours.childNodes.length) retours.append(el('div',{class:'retour faux'},'Ce n’est pas la bonne réponse.'));
      }
      maths(retours);
      if(bon || essai >= nbT){
        const gain = bon ? (pts[essai-1] ?? pts[pts.length-1] ?? 0) : 0;
        bilan.points += gain;
        lignes.forEach(x=>{ x.inp.disabled = true; x.lab.classList.add('bloque');
          if(justes.includes(x.k)) x.lab.classList.add('juste'); else if(x.inp.checked) x.lab.classList.add('faux'); });
        if(!bon && etape.retour_faux) retours.innerHTML = '';
        retours.prepend(html('div',{class:'retour '+(bon?'juste':'faux')}, bon ? riche(etape.retour_juste || 'Exact.')
                                 : riche(etape.retour_faux || 'La bonne réponse est indiquée en vert.')));
        if(etape.explication){ const ex = html('div',{class:'retour info'}, riche(etape.explication));
          const m = miniLecteur(etape.id+'_explication'); if(m) ex.append(m);
          retours.append(ex); maths(ex); }
        valider.remove(); info.textContent = '';
        ajouterAuRappel(etape.ajoute_au_rappel);
        SCORM.score(100*bilan.points/Math.max(1,bilan.max));
        const choisi = lignes.find(x=>x.inp.checked);
        if(auto){ quitter(choisi && choisi.o); return; }
        const suite = el('button',{type:'button'},'Continuer'); act.append(suite); suite.focus();
        suite.onclick = () => { suite.remove(); quitter(choisi && choisi.o); };
      } else {
        info.textContent = `Essai ${essai} sur ${nbT} : réessayez.`;
        lignes.forEach(x=>{ x.inp.checked=false; x.lab.classList.remove('coche'); }); valider.disabled = true;
      }
    };
  });
}

function lireNombre(txt){                                // 0,25 ; 1/4 ; 2.5e-3 ; espaces tolérés
  const t = String(txt).trim().replace(/[\s  ]/g,'').replace(/,/g,'.');
  if(!t || !/^[0-9.+\-*/()eE]+$/.test(t)) return NaN;
  try{ const v = Function('"use strict";return ('+t+');')(); return (typeof v === 'number' && isFinite(v)) ? v : NaN; }catch(e){ return NaN; }
}
const proche = (a, b, rel) => Math.abs(a-b) <= rel*Math.max(Math.abs(b), 1e-12);

function etapeNumerique(etape, loc){
  return new Promise(ok => {
    const {c, L} = carte(etape);

      ba.onclick = () => { const f = html('div',{class:'retour info'}, riche(A.texte)); const m = miniLecteur(etape.id+'_aide'); if(m) f.append(m);
        ba.replaceWith(f); maths(f); appliquerGraphique(A.graphique, loc);

      c.append(el('div',{class:'actions'}, ba));
    }
    const idc = 'rep-'+etape.id;
    const lab = el('label',{class:'sr', for:idc},'Votre réponse');
    const inp = el('input',{id:idc, type:'text', inputmode:'decimal', autocomplete:'off', placeholder: etape.exemple || 'Votre réponse (ex. 0,25 ou 1/4)'});
    const bt = el('button',{type:'button'},'Vérifier');
    const sa = el('div',{class:'saisie'}); sa.append(lab, inp, bt); c.append(sa);
    const ret = el('div',{'aria-live':'polite'}), tent = el('div',{class:'tentatives'}), act = el('div',{class:'actions'});
    c.append(ret, tent, act); maths(c); inp.focus({preventScroll:true});
    const attendu = evaluer(etape.attendu, loc);
    const tol = etape.tolerance ?? DEF.tolerance ?? 0.02;
    const nbT = etape.tentatives || DEF.tentatives, pts = etape.points_par_tentative || DEF.points_par_tentative;
    const erreurs = (etape.erreurs||[]).map(e => ({valeurs: [].concat(evaluer(e.si, loc)).filter(v => typeof v === 'number' && isFinite(v)), message: e.message}));
    bilan.max += 1;
    let k = 0;
    tent.textContent = nbT > 1 ? `Tentatives : ${nbT}` : '';
    const finir = (bon) => {
      inp.disabled = bt.disabled = true;
      const gain = bon ? (pts[k-1] ?? pts[pts.length-1] ?? 0) : 0; bilan.points += gain;
      if(etape.solution){ const so = html('div',{class:'retour info'}, (bon ? '' : '<b>Correction</b> : ') + riche(etape.solution));
        const m = miniLecteur(etape.id+'_explication'); if(m) so.append(m); c.insertBefore(so, act); maths(so); }
      appliquerGraphique((etape.fin||{}).graphique, loc);
      ajouterAuRappel(etape.ajoute_au_rappel);
      SCORM.score(100*bilan.points/Math.max(1,bilan.max));
      const quitter = () => { c.classList.remove('active'); L.arreter(); ok(); };
      if((etape.suite || DEF.suite) === 'auto') return quitter();
      const s = el('button',{type:'button'},'Continuer'); act.append(s); s.focus(); s.onclick = () => { s.remove(); quitter(); };
    };
    const verifierRep = () => {
      const v = lireNombre(inp.value);
      if(isNaN(v)){ ret.className = 'retour info'; ret.textContent = 'Entrez un nombre ou une fraction, par exemple 0,25 ou 1/4.'; return; }
      k++;
      const bon = typeof attendu === 'number' && proche(v, attendu, tol);
      SCORM.interaction(idI(etape.id)+'_'+k, 'numeric', String(v), bon?'correct':'wrong', typeof attendu === 'number' ? String(+attendu.toPrecision(6)) : '');
      son(bon ? 'juste' : 'faux');
      if(bon){ ret.className = 'retour juste'; ret.textContent = 'Exact.'; tent.textContent = ''; return finir(true); }
      const diag = erreurs.find(e => e.valeurs.some(x => proche(v, x, tol)));
      const reste = nbT - k;
      ret.className = 'retour faux';
      ret.innerHTML = riche(diag ? diag.message : 'Ce n’est pas la bonne valeur.') + ((!diag || k >= 2) && etape.indice ? '<br><i>Indice</i> : '+riche(etape.indice) : '');
      maths(ret);
      tent.textContent = reste > 0 ? `Tentatives restantes : ${reste}` : '';
      if(reste <= 0) finir(false); else inp.select();
    };
    bt.onclick = verifierRep;
    inp.addEventListener('keydown', e => { if(e.key === 'Enter') verifierRep(); });
  });
}

async function derouler(run){
  const etapes = CFG.etapes || [];
  let p = 0;
  while(p < etapes.length){
    if(run !== ESSAI) return;                             // « Recommencer » a relancé l'exercice
    const e0 = etapes[p];
    const n = e0.repeter ? Number(evaluer(e0.repeter)) || 0 : 0;
    const tours = e0.repeter ? Array.from({length:n}, (x, k) => ({k, i:k+1})) : [null];
    let saut = null;
    for(const loc of tours){
      if(!vrai(e0.si, loc || {})) continue;
      const e = tplObj(e0, loc || {});
      if(loc){ e.id = e0.id + loc.i; if(e0.audio) e.audio = e0.audio + loc.i; }
      const r = e.type === 'choix' ? await etapeChoix(e, loc || {}) : e.type === 'numerique' ? await etapeNumerique(e, loc || {}) : await etapeInfo(e);
      if(run !== ESSAI) return;
      if(r && r.aller_a){ saut = r.aller_a; break; }
    }
    if(saut){ const q = etapes.findIndex(x => x.id === saut); p = q >= 0 ? q : p+1; } else p++;
  }
  const conc = tplObj(CFG.conclusion || {}, {});
  const {c} = carte(Object.assign({id:'conclusion', titre: conc.titre || 'Conclusion'}, conc));
  const pc = 100*bilan.points/Math.max(1,bilan.max);
  if(bilan.max) c.append(el('p',{class:'bilan'}, `Score : ${Math.round(pc)} / 100`));
  c.classList.remove('active');
  ajouterAuRappel(conc.ajoute_au_rappel);
  SCORM.terminer(pc);
  if(conc.recommencer){
    const re = el('button',{type:'button', class:'secondaire'}, conc.recommencer === true ? 'Recommencer avec de nouvelles données' : conc.recommencer);
    re.onclick = () => demarrer(Math.floor(Math.random()*2**31)); c.append(el('div',{class:'actions'}, re));
  }
}

function demarrer(graine){
  ESSAI++;
  const T = CFG.donnees || {};
  MODE = (PARAMS.get('mode') === 'fixe' || (T.premier_essai === 'fixe' && ESSAI === 1)) ? 'fixe' : (T.mode || 'aleatoire');
  tirer(graine);
  ETAT_G.actif = -1; ETAT_G.lecture.clear(); ETAT_G.revele.clear(); ETAT_G.montre.clear(); GRAPHIQUES_ETAPES.length = 0;
  bilan.points = 0; bilan.max = 0;
  zone.innerHTML = '';
  if(AUTEUR && (CFG.avertissements||[]).length){
    const a = el('div',{class:'avert'}); a.append(el('strong',{},'Mode auteur — à vérifier : '));
    const ul = el('ul',{}); CFG.avertissements.forEach(x=>ul.append(el('li',{},x))); a.append(ul); zone.append(a);
  }
  if(AUTEUR && CFG.donnees) zone.append(html('div',{class:'avert'}, '<strong>Mode auteur — données ('+MODE+')</strong> : '
     + Object.entries(VARS).map(([k,v]) => k+' = '+fmt(v)).join(' ; ')));
  construireRappel(); maths(document.getElementById('rappel') || document.body);
  derouler(ESSAI);
}

/* ---------- Démarrage ---------- */
document.getElementById('titre').textContent = CFG.titre || '';
document.getElementById('cours').textContent = [CFG.cours, CFG.serie].filter(Boolean).join(' — ');
document.getElementById('pied').textContent = [CFG.auteur, 'ExoForge'].filter(Boolean).join(' — ');
if(Object.keys(SONS).length){
  const b = el('button',{type:'button', class:'secondaire', id:'sons'});
  const maj = () => { b.textContent = 'Sons : ' + (sonsActifs ? 'oui' : 'non'); b.setAttribute('aria-pressed', String(sonsActifs)); };
  b.onclick = () => { sonsActifs = !sonsActifs; try{ localStorage.setItem('exoforge-sons', sonsActifs ? 'oui' : 'non'); }catch(e){} maj(); };
  maj(); document.getElementById('pied').append(b);
}
SCORM.init();
demarrer(PARAMS.has('seed') ? Number(PARAMS.get('seed')) : Math.floor(Math.random()*2**31));
</script>
