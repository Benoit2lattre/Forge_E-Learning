<!doctype html>
<html lang="__LANGUE__">
<head>
<meta charset="utf-8">
<title>__TITRE__</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--navy:#14213D;--navy2:#28406B;--slate:#748CAB;--slate-l:#D3DDEC;--sand:#E0B989;--fond:#F7F6F4;--carte:#fff;--bord:#CDC9C0;
  --texte:#1A1815;--texte2:#615C52;--ok:#5C8A66;--focus:#FFCD00}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--texte);background:var(--fond);display:flex;flex-direction:column}
button,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{background:var(--navy);color:#fff;padding:8px 14px;display:flex;gap:12px;align-items:center;flex:none}
header h1{font-size:16px;margin:0;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:4px 10px}
header button:hover{background:rgba(255,255,255,.12)}
#b-pdf{color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:4px 10px;text-decoration:none;font-size:13px}
#b-pdf[hidden]{display:none}
#b-pdf:hover{background:rgba(255,255,255,.12)}
header label{font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
header label[hidden]{display:none}
#synth{font-size:12px;color:var(--texte2);white-space:nowrap}
#synth[hidden]{display:none}
header select{padding:3px 6px;border-radius:6px;border:0;max-width:210px}
main{flex:1;display:flex;min-height:0}
nav{flex:none;width:310px;background:var(--carte);border-right:1px solid var(--bord);overflow:auto;padding:10px 8px 30px}
nav.ferme{display:none}
nav h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--texte2);margin:12px 8px 4px}
nav .partie{margin:10px 0 2px;padding:0 8px;font-weight:600;color:var(--navy);display:flex;gap:8px}
nav .partie{align-items:center}
nav .partie svg{flex:none}
svg.disque text{font:600 12px system-ui,sans-serif}
#compteurs{margin:4px 8px 10px;padding:10px;border-radius:8px;background:var(--fond)}
#compteurs .total{font-size:13px;color:var(--texte2);margin-bottom:8px}
#compteurs .total b{color:var(--navy);font-size:15px}
.jauge{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin-bottom:7px;font-size:13px}
.jauge .rail{grid-column:1/3;height:8px;border-radius:4px;background:var(--slate-l);overflow:hidden}
.jauge .rail i{display:block;height:100%;background:var(--navy2);border-radius:4px;transition:width .3s}
.jauge .pc{font-variant-numeric:tabular-nums;font-weight:600;color:var(--navy)}
.jauge.hors{opacity:.5}
.jauge.hors .pc{font-weight:400;font-size:12px}
#disques{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px}
#disques button{background:none;border:0;padding:2px;border-radius:50%;line-height:0}
#disques button:hover:not(:disabled){background:var(--slate-l)}
#disques button:disabled{opacity:.45;cursor:default}
#disques .sep{width:1px;background:var(--bord);margin:2px 3px}
nav button.section{display:grid;grid-template-columns:20px 1fr auto;gap:6px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:5px 8px;color:inherit;align-items:start}
nav button.section:hover:not(:disabled){background:var(--slate-l)}
nav button.section.ici{background:#FBF3E7;box-shadow:inset 3px 0 0 var(--sand)}
nav button.section:disabled{color:#9A958A;cursor:default}
nav .etat{width:16px;height:16px;border-radius:50%;border:2px solid var(--slate);margin-top:3px}
nav .vue .etat{background:var(--ok);border-color:var(--ok)}
nav .ici .etat{border-color:var(--sand);background:var(--sand)}
nav button:disabled .etat{border-style:dashed;border-color:#C9C4B8}
nav .duree{font-size:12px;color:var(--texte2);font-variant-numeric:tabular-nums;margin-top:2px}
nav .renvoi{margin-left:34px;font-size:13px}
nav .renvoi button{background:none;border:0;color:var(--navy2);text-decoration:underline;padding:2px 0;text-align:left}
#zone{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:12px 16px 20px}
#tete{width:100%;max-width:1100px;display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
#tete .nom{font-size:13px;color:var(--texte2);font-variant-numeric:tabular-nums}
#tete h2{font-size:18px;margin:0;color:var(--navy)}
#cadre-scene{width:100%;max-width:1100px}
#scene{position:relative;background:var(--cadre,var(--navy));border-radius:8px;overflow:hidden;width:100%;box-shadow:0 2px 10px rgba(20,33,61,.18)}
#toile{position:absolute;left:0;top:0;width:100%;height:100%;background:#000}
#scene img{display:block;width:100%;height:100%;object-fit:contain}
#pied{width:100%;max-width:1100px;margin:4px auto 0;font-size:12px;color:var(--texte2);text-align:right}
#pied[hidden]{display:none}
header img.logo{height:28px;flex:none;background:#fff;border-radius:4px;padding:2px 6px}
#voile .logo-accueil{max-height:64px;max-width:40%;background:#fff;border-radius:8px;padding:6px 12px}
#voile .petit{font-size:13px;opacity:.85}
#didac{position:absolute;inset:0;pointer-events:none;container-type:inline-size;overflow:hidden}
#scene.avous{cursor:crosshair}
.d-cadre{position:absolute;border:3px solid var(--sand);border-radius:4px;box-shadow:0 0 0 2000px rgba(0,0,0,.18);opacity:0;transition:opacity .2s}
.d-cadre.visible{opacity:1}
.d-cadre.indice{border-style:dashed;box-shadow:none;border-color:var(--navy2)}
.d-bulle{position:absolute;max-width:34%;background:#fff;color:var(--texte);border:2px solid var(--navy);border-radius:8px;padding:.35em .6em;
  font-size:max(11px,1.5cqw);line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:0;transition:opacity .2s}
.d-bulle.visible{opacity:1}
.d-bulle b{color:var(--navy2)}
#souris{position:absolute;width:2.2%;min-width:14px;transform:translate(-8%,-4%);filter:drop-shadow(1px 1px 1px rgba(0,0,0,.5))}
.d-onde{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--focus)}
.d-onde.faux{border-color:#B85C50}
.d-onde.juste{border-color:var(--ok)}
.d-saisie{position:absolute;box-sizing:border-box;background:#fff;color:#111;border:2px solid var(--navy2);border-radius:3px;font:inherit;
  padding:0 .3em;display:flex;align-items:center;white-space:nowrap;overflow:hidden;pointer-events:auto}
#d-message{width:100%;max-width:1100px;margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--carte);border:1px solid var(--bord);font-size:15px}
#d-message[hidden]{display:none}
#d-message.juste{border-left:4px solid var(--ok)}
#d-message.faux{border-left:4px solid #B85C50}
#d-message button{border:1px solid var(--navy2);background:var(--sand);color:var(--navy);border-radius:6px;padding:3px 12px;margin-left:8px;font-weight:600}
#b-mode[hidden]{display:none}
#film{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#film[hidden]{display:none}
#cameo{position:absolute;z-index:4;object-fit:cover;background:#000;box-shadow:0 2px 12px #0008;border:3px solid #fff;pointer-events:none}
#cameo.rond{border-radius:50%;aspect-ratio:1/1}#cameo.rectangle{border-radius:10px;aspect-ratio:16/9}
#cameo.bas-droite{right:2.5%;bottom:4%}#cameo.bas-gauche{left:2.5%;bottom:4%}#cameo.haut-droite{right:2.5%;top:4%}#cameo.haut-gauche{left:2.5%;top:4%}
#cameo[hidden]{display:none}
#incrustes{position:absolute;inset:0;pointer-events:none}
#incrustes .inc{position:absolute;pointer-events:auto;cursor:pointer}
#incrustes .inc img,#incrustes .inc video{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
#incrustes .inc.plein{left:0!important;top:0!important;width:100%!important;height:100%!important;background:#000;z-index:3}
#incrustes .inc.plein video,#incrustes .inc.plein img{object-fit:contain}
#incrustes [hidden]{display:none}
#calque{position:absolute;inset:0;pointer-events:none}
#calque svg{position:absolute;inset:0;width:100%;height:100%}
#calque .o{position:absolute}
#calque .cadre{border:3px solid #D7263D;border-radius:6px}
#calque .ellipse{border-radius:50%}
#calque .pointeur{width:2.2%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#E0142D;box-shadow:0 0 0 5px rgba(224,20,45,.3),0 0 14px 4px rgba(224,20,45,.6)}
#st{position:absolute;left:4%;right:4%;bottom:3.5%;text-align:center;pointer-events:none}
#st span{background:rgba(0,0,0,.76);color:#fff;padding:3px 9px;border-radius:4px;font-size:var(--st,16px);line-height:1.7;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#voile{position:absolute;inset:0;background:rgba(20,33,61,.82);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:5%;overflow:auto}
#voile[hidden]{display:none}
#voile h3{margin:0;font-size:clamp(18px,2.4vw,28px)}
#voile p{margin:0;max-width:46em;font-size:clamp(14px,1.5vw,18px)}
#voile .boutons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#voile button{border-radius:8px;border:1px solid #fff;background:transparent;color:#fff;padding:8px 16px;font-size:16px}
#voile button.principal{background:var(--sand);border-color:var(--sand);color:var(--navy);font-weight:600}
#voile button:hover{filter:brightness(1.12)}
#voile.quiz{align-items:stretch;justify-content:flex-start;background:rgba(20,33,61,.9)}
.carte{background:#fff;color:var(--texte);border-radius:10px;padding:16px 20px;text-align:left;max-width:760px;width:100%;margin:auto;font-size:clamp(14px,1.35vw,17px)}
.carte .rang{font-size:13px;color:var(--texte2);margin-bottom:4px}
.carte .enonce{font-weight:600;font-size:1.08em;margin:0 0 10px}
.carte fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.carte label.option{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--bord);border-radius:8px;padding:8px 10px;cursor:pointer}
.carte label.option:hover{background:var(--fond)}
.carte label.option input{margin-top:4px;flex:none;width:16px;height:16px}
.carte label.option.juste{border-color:var(--ok);background:#E4F0E6}
.carte label.option.faux{border-color:#B85C50;background:#F6E3E0}
.carte .champ{display:flex;gap:8px;align-items:center}
.carte .champ input{font:inherit;padding:6px 8px;border:1.5px solid var(--bord);border-radius:6px;width:9em}
.carte .retour{margin-top:10px;padding:9px 12px;border-radius:8px;background:var(--fond);border-left:4px solid var(--slate)}
.carte .retour.juste{border-left-color:var(--ok)}
.carte .retour.faux{border-left-color:#B85C50}
.carte .retour b{display:block;margin-bottom:2px}
.carte .retour p{margin:4px 0 0;font-size:1em;max-width:none}
.carte .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#voile .carte button{border:1px solid var(--navy2);background:#fff;color:var(--navy);font-size:1em;padding:6px 14px;border-radius:8px}
#voile .carte button.principal{background:var(--sand);border-color:var(--sand);font-weight:600}
#voile .carte button:disabled{opacity:.45;cursor:default}
nav .duree .q{color:var(--navy2);white-space:nowrap}
#barre{width:100%;max-width:1100px;display:flex;gap:10px;align-items:center;margin-top:8px;background:var(--carte);border:1px solid var(--bord);border-radius:8px;padding:6px 10px;flex-wrap:wrap}
#barre button{border:1px solid var(--navy2);background:#fff;color:var(--navy);border-radius:6px;padding:4px 10px;min-width:38px}
#barre button:hover:not(:disabled){background:var(--slate-l)}
#barre button:disabled{opacity:.4;cursor:default}
#barre button[aria-pressed="true"]{background:var(--navy);color:#fff}
#barre button[aria-pressed="true"]:hover:not(:disabled){background:var(--navy2);color:#fff}   /* enfoncé et survolé : reste lisible */
#jouer{background:var(--sand)!important;border-color:var(--sand)!important;font-weight:600;min-width:86px!important}
#temps{font-variant-numeric:tabular-nums;font-size:13px;color:var(--texte2);white-space:nowrap}
#piste{position:relative;flex:1;min-width:160px;height:22px;cursor:pointer;touch-action:none}
#piste::before{content:"";position:absolute;left:0;right:0;top:8px;height:6px;border-radius:3px;background:var(--slate-l)}
#fait{position:absolute;left:0;top:8px;height:6px;border-radius:3px;background:var(--navy2);width:0}
#piste .coupe{position:absolute;top:5px;width:2px;height:12px;background:#fff;box-shadow:0 0 0 1px var(--slate)}
#curseur{position:absolute;top:3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--navy);left:0}
#texte{width:100%;max-width:1100px;margin-top:10px;background:var(--carte);border:1px solid var(--bord);border-radius:8px;padding:10px 14px;line-height:1.6;max-height:34vh;overflow:auto;position:relative}
#texte[hidden]{display:none}
#texte h3{margin:0 0 4px;font-size:13px;color:var(--texte2);font-weight:600}
#texte .ph{cursor:pointer;border-radius:3px;padding:1px 0}
#texte .ph:hover{background:var(--slate-l)}
#texte .ph.ici{background:#FBE9CF}
#texte .pas{margin:0 0 8px}
#texte{font-size:calc(1.05rem * var(--taille-texte, 1))}
#texte h3{display:flex;align-items:center;gap:8px}
#texte h3 .esp{flex:1}
#texte h3 button{font-size:12px;padding:2px 8px;min-height:0}
#texte .diapo{margin:6px 0 6px;padding:4px 10px;border-left:3px solid var(--slate-l)}
#texte .diapo .dt{font-weight:700;margin:2px 0}
#texte .diapo .dp{margin:2px 0}
#texte .diapo a{color:inherit;text-decoration:underline}
#texte .diapo .df{margin:4px 0;overflow-x:auto}
#texte .diapo table{border-collapse:collapse;margin:4px 0}
#texte .diapo td{border:1px solid var(--bord);padding:2px 8px}
#texte .diapo .plus-tard{opacity:.35}
/* texte aéré : police sans empattement courante, lettres et mots plus espacés (l'espacement aide, pas une police « dyslexie ») */
#texte.aere, #st.aere span{font-family:Verdana, Arial, sans-serif !important;letter-spacing:.07em;word-spacing:.16em;line-height:1.8}
.aide{font-size:12px;color:var(--texte2);margin-top:8px;max-width:1100px;width:100%}
kbd{border:1px solid var(--bord);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff;font:12px ui-monospace,Consolas,monospace}
#cadre-scene[hidden],#barre[hidden],#exo[hidden],.aide[hidden]{display:none}
#exo{width:100%;max-width:1100px;display:flex;flex-direction:column;gap:8px}
#exo-bande{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--carte);border:1px solid var(--bord);border-radius:8px;padding:6px 10px;font-size:14px}
#exo-bande .esp{flex:1}
#exo-bande button{border:1px solid var(--navy2);background:#fff;color:var(--navy);border-radius:6px;padding:4px 12px}
#exo-bande button.principal{background:var(--sand);border-color:var(--sand);font-weight:600}
#exo-bande button:hover{filter:brightness(.97)}
#exo-cadre{width:100%;border:1px solid var(--bord);border-radius:8px;background:#fff;min-height:420px}
nav .exo-score{color:var(--navy2);white-space:nowrap}
@media (max-width:860px){nav{position:absolute;z-index:5;top:44px;bottom:0;left:0;width:min(88vw,330px);box-shadow:4px 0 16px rgba(0,0,0,.25)}main{position:relative}header label span{display:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <button id="b-plan" aria-expanded="true" aria-controls="plan" title="Afficher ou masquer le plan">☰ Plan</button>
  <h1 id="titre"></h1>
  <label id="l-voix" hidden><span>Voix</span> <select id="voix" aria-label="Langue de la voix"></select></label>
  <label id="l-stl" hidden><span>Sous-titres</span> <select id="stl" aria-label="Langue des sous-titres et des titres"></select></label>
  <label id="l-parcours"><span>Parcours</span> <select id="parcours" aria-label="Parcours"></select></label>
  <a id="b-pdf" hidden target="_blank" rel="noopener" title="Document PDF de la capsule (diapositives et textes, à imprimer)">PDF</a>
</header>
<main>
  <nav id="plan" aria-label="Plan du chapitre"></nav>
  <div id="zone">
    <div id="tete"><span class="nom" id="s-nom"></span><h2 id="s-titre"></h2></div>
    <div id="cadre-scene">
      <div id="scene">
        <div id="toile">
        <img id="image" alt="">
        <video id="film" muted playsinline preload="auto" hidden></video>
        <div id="incrustes"></div>
        <div id="calque"></div>
        <video id="cameo" muted playsinline preload="auto" hidden aria-hidden="true"></video>
        <div id="didac"><div id="d-cadre" class="d-cadre"></div><div id="d-bulle" class="d-bulle" role="status"></div>
          <svg id="souris" viewBox="0 0 24 36" aria-hidden="true" style="display:none"><path d="M1 1 L1 29 L8 22 L13 34 L18 32 L13 20 L23 20 Z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
        </div>
        <div id="st" aria-hidden="true"></div>
        <div id="voile"></div>
      </div>
      <div id="pied" hidden></div>
    </div>
    <div id="barre" role="group" aria-label="Lecture">
      <button id="jouer" title="Lire ou mettre en pause (Espace)">▶ Lire</button>
      <button id="reculer" title="Reculer de 10 s (←)" aria-label="Reculer de 10 secondes">−10 s</button>
      <div id="piste" role="slider" tabindex="0" aria-label="Position dans la section" aria-valuemin="0"><div id="fait"></div><div id="curseur"></div></div>
      <span id="temps">0:00 / 0:00</span>
      <span id="synth" hidden title="Ce passage est lu par une voix de synthèse">🗣 voix de synthèse</span>
      <select id="vitesse" aria-label="Vitesse de lecture" title="Vitesse"><option value="0.75">× 0,75</option><option value="1" selected>× 1</option><option value="1.25">× 1,25</option><option value="1.5">× 1,5</option><option value="2">× 2</option></select>
      <button id="b-mode" hidden aria-pressed="false" title="Faire vous-même les gestes de cette section">✋ À vous</button>
      <button id="b-cameo" hidden aria-pressed="true" title="Médaillon vidéo de l'enseignant (V)">👤 Caméo</button>
      <button id="b-son" aria-pressed="true" title="Son : lire avec ou sans la voix (M)">🔊 Son</button>
      <button id="b-st" aria-pressed="true" title="Sous-titres (C)">Sous-titres</button>
      <button id="b-texte" aria-pressed="false" title="Texte de la section (T)">Texte</button>
      <button id="b-ecran" title="Plein écran (F)" aria-label="Plein écran">⛶</button>
    </div>
    <div id="d-message" role="status" aria-live="assertive" hidden></div>
    <div id="exo" hidden>
      <div id="exo-bande" role="group" aria-label="Exercice"><span id="exo-etat" role="status"></span><span class="esp"></span></div>
      <iframe id="exo-cadre" title="Exercice"></iframe>
    </div>
    <section id="texte" hidden aria-label="Texte de la section"></section>
    <div class="aide"><kbd>Espace</kbd> lire / pause · <kbd>←</kbd> <kbd>→</kbd> reculer / avancer de 10 s · <kbd>M</kbd> son · <kbd>C</kbd> sous-titres · <kbd>T</kbd> texte · <kbd>F</kbd> plein écran</div>
  </div>
</main>
<audio id="son" preload="auto"></audio>
<script id="donnees" type="application/json">__CHAPITRE_JSON__</script>
<script>
"use strict";
const C = JSON.parse(document.getElementById("donnees").textContent);
const $ = id => document.getElementById(id), son = $("son");
const L = C.ecran.largeur, H = C.ecran.hauteur;
/* ---------- plateforme SCORM 2004 ou 1.2 (Moodle) : avancement, achèvement, note et traces ; hors plateforme, rien ne change ---------- */
const LMS = (() => {
  /* API_1484_11 = SCORM 2004 ; API = SCORM 1.2, cherchée seulement dans les fenêtres parentes (le lecteur définit lui-même
     window.API pour les exercices ExoForge qu'il affiche) */
  const chercher = (w, nom, depuisParent) => { let k = 0;
    if (depuisParent) { if (!w || w.parent === w) return null; w = w.parent; }
    while (w && !w[nom] && w.parent && w.parent !== w && k++ < 10) w = w.parent; return w && w[nom]; };
  let api = null, v12 = false;
  try { api = chercher(window, "API_1484_11") || (window.opener && chercher(window.opener, "API_1484_11")) || null; } catch (e) { api = null; }
