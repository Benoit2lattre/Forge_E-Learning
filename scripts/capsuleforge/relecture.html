<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CapsuleForge — relecture</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--navy:#14213D;--navy2:#28406B;--slate:#748CAB;--slate-l:#D3DDEC;--sand:#E0B989;--fond:#F7F6F4;--bord:#CDC9C0;
  --texte:#1A1815;--texte2:#615C52;--ok:#5C8A66;--ok-l:#D7E6DA;--ko:#B85C50;--ko-l:#EFD9D5;--focus:#FFCD00}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--texte);background:var(--fond);
  display:flex;flex-direction:column;overflow:hidden}
header{background:var(--navy);color:#fff;padding:7px 14px;display:flex;gap:10px;align-items:center;flex:none}
header h1{font-size:16px;margin:0;white-space:nowrap}
header #titre{opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
header #etat{font-size:12px;opacity:.9;white-space:nowrap}
button,select,input{font:inherit}
button{padding:4px 9px;border:1px solid var(--navy2);border-radius:6px;background:#fff;color:var(--navy);cursor:pointer}
button:hover:not(:disabled){background:var(--slate-l)}
button:disabled{opacity:.45;cursor:default}
button.primaire{background:var(--sand);border-color:var(--sand);font-weight:600}
button.petit{padding:1px 6px;font-size:12px}
select{padding:3px 6px;border:1px solid var(--bord);border-radius:6px;background:#fff;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
main{flex:1;display:flex;min-height:0}
#gauche{flex:1 1 52%;min-width:0;display:flex;flex-direction:column;padding:10px 12px;gap:8px;overflow:auto}
#droite{flex:1 1 48%;min-width:340px;display:flex;flex-direction:column;border-left:1px solid var(--bord);background:#fff;min-height:0}
#choix{display:flex;gap:6px;align-items:center}
#choix select{flex:1;min-width:0}
#scene{position:relative;background:#000;border:1px solid var(--bord);border-radius:6px;overflow:hidden;flex:none}
#scene img{display:block;width:100%;height:auto}
#soustitre{position:absolute;left:4%;right:4%;bottom:3%;text-align:center;pointer-events:none}
#soustitre span{background:rgba(0,0,0,.72);color:#fff;padding:3px 8px;border-radius:4px;font-size:14px;line-height:1.7;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
#calque{position:absolute;inset:0;z-index:1;touch-action:none}
#incrustes{position:absolute;inset:0;pointer-events:none}
#incrustes .inc{position:absolute}
#incrustes .inc img,#incrustes .inc video{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
#incrustes .inc.plein{left:0!important;top:0!important;width:100%!important;height:100%!important;background:#000;z-index:2}
#incrustes .inc.plein img,#incrustes .inc.plein video{object-fit:contain}
#incrustes [hidden]{display:none}
#videos .options{font-size:12px;color:var(--texte2);display:inline-flex;gap:8px;flex-wrap:wrap}
#videos .duree{font-size:12px;color:var(--texte2)}
.marque.video{color:var(--navy2)}
#piste .ob.video{background:rgba(31,78,140,.35);top:6px;height:8px}
#calque.dessin{cursor:crosshair}
#calque .o{position:absolute;box-sizing:border-box}
#calque .spot{border-radius:8px}
#calque .ellipse{border-radius:50%}
#calque svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#calque .o.choisi.hors{outline-color:#fff;outline-style:dotted}
#objets select{padding:1px 3px;font-size:12px}
#calque .cadre{border:3px solid #D7263D;border-radius:6px}
#calque .cache.hors{opacity:.55}
#calque .pointeur{width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#E0142D;box-shadow:0 0 0 5px rgba(224,20,45,.3),0 0 14px 4px rgba(224,20,45,.6)}
#calque .o.choisi{outline:2px dashed var(--focus);outline-offset:2px;cursor:move}
#calque .poignee{position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;background:var(--focus);border:1px solid var(--navy);cursor:nwse-resize}
#soustitre{z-index:2}
#ajouts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#ajouts button.actif{background:var(--navy);color:#fff}
#objets{display:flex;flex-direction:column;gap:4px}
#objets .ligne{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:3px 6px;border:1px solid var(--bord);border-radius:6px;background:#fff;cursor:pointer}
#objets .ligne.choisi{border-color:var(--navy2);background:var(--slate-l)}
#objets input{width:66px;padding:2px 4px;border:1px solid var(--bord);border-radius:4px}
#objets .nom{font-weight:600;color:var(--navy2);min-width:86px}
#piste .ob{position:absolute;top:15px;height:6px;background:var(--navy2);border-radius:3px;opacity:.8}
#piste .ob.cache{background:var(--texte2)}
#fini{position:fixed;inset:0;background:var(--fond);display:none;align-items:center;justify-content:center;z-index:20;font-size:18px;text-align:center;padding:20px}
#commandes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#temps{font-variant-numeric:tabular-nums;min-width:96px}
#piste{position:relative;height:52px;background:#fff;border:1px solid var(--bord);border-radius:6px;cursor:pointer;flex:none;user-select:none}
#piste .ph{position:absolute;top:24px;height:26px;background:var(--slate-l);border-right:1px solid #fff}
#piste .ph:nth-child(even){background:#E7ECF4}
#piste .ph.active{background:var(--sand)}
#piste .app{position:absolute;top:0;width:18px;margin-left:-9px;height:100%;cursor:ew-resize;z-index:2}
#piste .app::before{content:"";position:absolute;left:8px;top:14px;bottom:0;width:2px;background:var(--ko)}
#piste .app b{position:absolute;top:0;left:-3px;min-width:24px;text-align:center;background:var(--ko);color:#fff;font-size:10px;
  border-radius:3px;padding:0 3px;line-height:14px}
#tete{position:absolute;top:0;bottom:0;width:2px;background:var(--navy);z-index:3;pointer-events:none}
#apparitions,#videos{display:flex;flex-direction:column;gap:4px}
#apparitions .ligne,#videos .ligne{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:3px 6px;border:1px solid var(--bord);border-radius:6px;background:#fff}
#apparitions .ligne.vue{border-color:var(--ko);background:var(--ko-l)}
#apparitions img,#videos img{height:42px;border:1px solid var(--bord);border-radius:3px;cursor:pointer}
#apparitions input,#videos input[type=number]{width:74px;padding:2px 4px;border:1px solid var(--bord);border-radius:4px}
#apparitions .nom{font-weight:600;color:var(--ko);min-width:22px}
#videos .nom{font-weight:600;color:var(--navy2);min-width:22px}
h2{font-size:13px;margin:6px 0 0;color:var(--texte2);font-weight:600;text-transform:none}
#entete-droite{padding:8px 12px;border-bottom:1px solid var(--bord);display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none}
#entete-droite .info{color:var(--texte2);font-size:12px;flex:1;min-width:120px}
#remarques{flex:none;padding:6px 12px;border-bottom:1px solid var(--bord);background:#FBF4EA;font-size:13px;max-height:30vh;overflow:auto}
#remarques[hidden]{display:none}
#remarques ul{margin:2px 0 0;padding-left:18px}
#remarques li.erreur{color:var(--ko)}
#remarques summary{cursor:pointer;color:var(--texte2)}
#phrases{flex:1;overflow:auto;padding:6px 8px 60px}
.phrase{display:grid;grid-template-columns:64px 1fr auto;gap:6px;align-items:start;padding:5px 4px;border-radius:6px;border:1px solid transparent}
.phrase.active{background:#FBF3E7;border-color:var(--sand)}
.phrase .jouer{font-variant-numeric:tabular-nums;font-size:12px;padding:3px 4px;text-align:center}
.phrase textarea{width:100%;resize:none;overflow:hidden;border:1px solid var(--bord);border-radius:6px;padding:5px 7px;font:inherit;
  line-height:1.45;background:#fff;color:inherit}
.phrase textarea:focus{border-color:var(--navy2)}
.phrase .outils{display:flex;flex-direction:column;gap:2px}
.phrase .outils>div{display:flex;flex-direction:column;gap:2px}
.phrase .outils button{white-space:nowrap;text-align:left}
.phrase .outils select{font-size:12px;padding:1px 2px;width:100%;color:var(--ko)}
.phrase .outils .pause{font-size:12px;color:var(--texte2);white-space:nowrap}
.phrase .outils .pause input{width:52px;font-size:12px;padding:1px 3px}
.accroche{font-size:12px;color:var(--texte2);white-space:nowrap}
.accroche select,.accroche input{font-size:12px;padding:1px 2px}
.accroche input{width:56px}
.phrase .duree{grid-column:1;font-size:11px;color:var(--texte2);text-align:center}
.phrase .num{font-size:12px;font-weight:600;color:var(--navy2);text-align:center}
.phrase .public{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px}
.phrase .public[hidden]{display:none}
.phrase .public input{flex:1;min-width:180px;font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--bord);border-radius:6px}
.phrase.longue .duree{color:var(--ko);font-weight:600}
.marque{display:flex;align-items:center;gap:6px;color:var(--ko);font-size:12px;margin:1px 4px 1px 70px}
.marque::after{content:"";flex:1;border-top:1px dashed var(--ko)}
.marque.objet{color:var(--navy2)}
.marque.objet::after{border-color:var(--slate)}
#aide{font-size:12px;color:var(--texte2);padding:6px 12px;border-top:1px solid var(--bord);flex:none}
kbd{border:1px solid var(--bord);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff;font:12px ui-monospace,Consolas,monospace}
#message{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:7px 14px;border-radius:8px;
  display:none;z-index:10;max-width:80%}
#message.ko{background:var(--ko)}
label.coche{display:flex;gap:5px;align-items:center;white-space:nowrap}
@media (max-width:900px){main{flex-direction:column;overflow:auto}#droite{border-left:0;border-top:1px solid var(--bord);min-height:60vh}body{overflow:auto}}
</style>
</head>
<body>
<header>
  <h1>Relecture</h1><span id="titre"></span><span id="etat"></span>
  <button id="annuler" title="Annuler la dernière coupe, fusion ou pose (Ctrl+Z hors d'un texte)" disabled>Annuler</button>
  <button id="enregistrer" class="primaire" title="Ctrl+S">Enregistrer</button>
  <button id="quitter" title="Enregistre, puis arrête la relecture et libère la fenêtre de commande">Enregistrer et quitter</button>
</header>
<main>
  <section id="gauche">
    <div id="choix">
      <button id="precedent" title="Pas précédent">◀</button>
      <select id="pas" aria-label="Pas à relire"></select>
      <button id="suivant" title="Pas suivant">▶</button>
    </div>
    <div id="scene"><img id="image" alt="Diapositive à l'instant de lecture"><div id="incrustes"></div><div id="calque"></div><div id="soustitre"></div></div>
    <div id="commandes">
      <button id="lecture" class="primaire" title="Échap">▶ Lire</button>
      <span id="temps">0:00 / 0:00</span>
      <label>Vitesse <select id="vitesse"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select></label>
      <label class="coche"><input type="checkbox" id="st" checked> phrase sur l'image</label>
    </div>
    <div id="piste" title="Cliquer pour se placer ; faire glisser un repère rouge pour déplacer une apparition"><div id="tete"></div></div>
    <div id="ajouts">
      <span>Ajouter :</span>
      <button data-outil="spot" title="Éclaire une zone et assombrit le reste : tracer la zone sur l'image">Spot</button>
      <button data-outil="cadre" title="Entoure une zone : tracer la zone sur l'image">Cadre</button>
      <button data-outil="pointeur" title="Point lumineux, comme un pointeur laser : cliquer sur l'image">Pointeur</button>
      <button data-outil="cache" title="Cache une zone jusqu'à un instant donné (apparition absente du diaporama) : tracer la zone sur l'image">Cache</button>
      <span id="ajout-info" style="color:var(--texte2);font-size:12px"></span>
    </div>
    <h2 id="titre-app">Apparitions</h2>
    <div id="apparitions"></div>
    <h2 id="titre-vid">Vidéos insérées</h2>
    <div id="videos"></div>
    <h2 id="titre-obj">Ajouts sur l'image</h2>
    <div id="objets"></div>
  </section>
  <section id="droite">
    <div id="entete-droite">
      <span class="info" id="info"></span>
      <label class="coche" title="Marque ce pas comme relu par l'auteur"><input type="checkbox" id="relu"> Relu</label>
    </div>
    <div id="remarques" role="note" aria-label="Remarques de la vérification" hidden></div>
    <div id="phrases"></div>
    <div id="aide">
      <kbd>Échap</kbd> lire / pause · <kbd>Alt</kbd>+<kbd>↑</kbd> <kbd>↓</kbd> phrase précédente / suivante ·
      <kbd>Ctrl</kbd>+<kbd>Entrée</kbd> couper au curseur · <kbd>Ctrl</kbd>+<kbd>S</kbd> enregistrer
    </div>
  </section>
</main>
<div id="message" role="status"></div>
<div id="fini"><p>Relecture terminée et enregistrée.<br>Vous pouvez fermer cet onglet ; la fenêtre de commande est libérée.</p></div>
<audio id="son" preload="auto"></audio>
<script>
"use strict";
const $ = id => document.getElementById(id);
const audio = $("son");
/* horloge muette : un pas sans son se lit quand même, au débit estimé de la langue (mêmes gestes qu'avec le son) */
const muette = { _t: 0, _t0: 0, _d: 0, _l: false, playbackRate: 1, duration: NaN, onplay: null, onpause: null, onseeked: null,
  get currentTime() { return this._l ? Math.min(duree(), this._t0 + (performance.now() - this._d) / 1000 * this.playbackRate) : this._t; },
  set currentTime(v) { this._t = Math.max(0, +v || 0); if (this._l) { this._t0 = this._t; this._d = performance.now(); } if (this.onseeked) this.onseeked(); },
  get paused() { return !this._l; },
  play() { if (!this._l) { if (this._t >= duree() - 0.05) this._t = 0; this._t0 = this._t; this._d = performance.now(); this._l = true; if (this.onplay) this.onplay(); } return Promise.resolve(); },
  pause() { if (this._l) { this._t = this.currentTime; this._l = false; if (this.onpause) this.onpause(); } } };
let son = audio;
let CAL = { decalage_s: -0.4, pause_s: 0.4, avant_s: 0.5, debit: 150 };
const muet = () => P && !P.audio;
/* instants estimés des phrases d'un pas sans son (même règle que calage.py) */
function estimer(p) {
  if (p.audio) return; let t = CAL.avant_s;
  for (const ph of p.phrases) { const n = ph.texte.split(/\s+/).filter(Boolean).length, d = Math.max(0.8, n * 60 / CAL.debit);
    ph.debut_s = +t.toFixed(2); ph.fin_s = +(t + d).toFixed(2); t += d + (ph.pause_s != null ? ph.pause_s : CAL.pause_s); }
  p.duree_s = p.phrases.length ? +t.toFixed(2) : (p.duree_s || 1);
}
/* objets accrochés à une phrase : leur instant suit la phrase */
const accroches = () => [...P.apparitions, ...P.objets, ...(P.videos || [])].filter(o => o.phrase != null && o.type !== "cache");
function base(o) { const ph = P.phrases[Math.min(Math.max(o.phrase - 1, 0), P.phrases.length - 1)];
  return ph && horodatee(ph) ? (o.ancre === "fin" ? ph.fin_s : ph.debut_s) : null; }
const decalageDe = o => o.decalage_s != null ? o.decalage_s : CAL.decalage_s;
function resoudre() { for (const o of accroches()) { const b = base(o); if (b != null) o.debut_s = +Math.max(0, b + decalageDe(o)).toFixed(2); }
  for (const v of P.videos || []) if (v.phrase == null && v.avec) { const a = P.apparitions.find(x => x.id === v.avec); v.debut_s = a ? a.debut_s : 0; } }
function garderAccroche(o) { if (o.phrase == null) return; const b = base(o); if (b == null) return;
  const d = +(o.debut_s - b).toFixed(2); if (Math.abs(d - CAL.decalage_s) < 0.005) delete o.decalage_s; else o.decalage_s = d; }
function accrocher(o, i) { if (i == null) { delete o.phrase; delete o.ancre; delete o.decalage_s; return; } o.phrase = i + 1; delete o.ancre; }
const nomAccroche = o => o.phrase == null ? "" : " · L" + o.phrase + (o.ancre === "fin" ? " (fin)" : "") + " " + (decalageDe(o) >= 0 ? "+" : "−") + Math.abs(decalageDe(o)).toFixed(1).replace(".", ",") + " s";
let C = null, P = null, rang = 0, arretA = null, pile = [], preparees = 0, outil = null, choisi = null, phraseChoisie = -1, fini = false;
const NOMS = { spot: "Spot", cadre: "Cadre", pointeur: "Pointeur", cache: "Cache" };
const modifies = new Set();

const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - 60 * m; return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1).replace(".", ","); };
const duree = () => (isFinite(son.duration) && son.duration) || (P && P.duree_s) || (P && P.phrases.length && P.phrases[P.phrases.length - 1].fin_s) || 1;
const horodatee = ph => ph.debut_s != null;

function message(txt, ko) { const m = $("message"); m.textContent = txt; m.className = ko ? "ko" : ""; m.style.display = "block"; clearTimeout(message.t); message.t = setTimeout(() => m.style.display = "none", ko ? 7000 : 2500); }
function marquer() { modifies.add(P.id); etat(); listePas(); }
function etat() { $("etat").textContent = modifies.size ? modifies.size + " pas à enregistrer" : "enregistré"; $("annuler").disabled = !pile.length; }
function memoriser() { pile.push({ id: P.id, phrases: JSON.parse(JSON.stringify(P.phrases)), apparitions: JSON.parse(JSON.stringify(P.apparitions)), objets: JSON.parse(JSON.stringify(P.objets)) }); if (pile.length > 60) pile.shift(); }

async function charger() {
  const r = await (await fetch("/api/chapitre")).json();
  if (!r.ok) return message(r.message || "Lecture impossible", true);
  C = r; if (r.calage) CAL = Object.assign(CAL, r.calage); $("titre").textContent = r.titre + " — " + r.dossier; document.title = "Relecture — " + r.dossier;
  for (const p of C.pas) p.objets = p.objets || [];
  for (const p of C.pas) if (p.prepare) { modifies.add(p.id); preparees++; }
  const voulu = decodeURIComponent(location.hash.slice(1));
  rang = Math.max(0, C.pas.findIndex(p => p.id === voulu || p.nom === voulu));
  if (rang < 0 || !voulu) rang = Math.max(0, C.pas.findIndex(p => p.phrases.length));
  listePas(); ouvrir(rang); etat();
  if (preparees) message(preparees + " pas : phrases préparées d'après la transcription, à enregistrer");
}

const remarquesDe = id => (C && C.remarques && C.remarques[id]) || [];
function compte(liste) {
  const e = liste.filter(r => r.niveau === "erreur").length, a = liste.length - e;
  return [e && e + " erreur" + (e > 1 ? "s" : ""), a && a + " avertissement" + (a > 1 ? "s" : "")].filter(Boolean).join(", ");
}
function afficherRemarques() {
  const z = $("remarques"), r = P ? remarquesDe(P.id) : [], g = (C && C.generales) || [];
  z.textContent = "";
  const liste = items => { const ul = document.createElement("ul"); for (const x of items) { const li = document.createElement("li"); li.className = x.niveau; li.textContent = (x.niveau === "erreur" ? "Erreur : " : "") + x.texte; ul.appendChild(li); } return ul; };
  if (r.length) { const t = document.createElement("strong"); t.textContent = "À vérifier sur ce pas (" + compte(r) + ")"; z.append(t, liste(r)); }
  if (g.length) { const d = document.createElement("details"), s = document.createElement("summary"); s.textContent = "Reste du chapitre : " + compte(g); d.append(s, liste(g)); z.appendChild(d); }
  z.hidden = !r.length && !g.length;
}
function prendreRemarques(r) { if (r && r.remarques) { C.remarques = r.remarques; C.generales = r.generales || []; } }

function listePas() {
  const s = $("pas"); s.textContent = ""; let groupe = null, nomG = null;
  C.pas.forEach((p, i) => {
    if (p.section !== nomG) { groupe = document.createElement("optgroup"); groupe.label = p.section; s.appendChild(groupe); nomG = p.section; }
    const o = document.createElement("option"); o.value = i;
    o.textContent = (p.relu ? "✓ " : "") + (modifies.has(p.id) ? "● " : "") + (remarquesDe(p.id).length ? "⚠ " : "") + p.nom + (p.titre ? " — " + p.titre : "") + (p.phrases.length ? "" : " (sans texte)");
    groupe.appendChild(o);
  });
  s.value = rang;
}

function ouvrir(i) {
  rang = Math.max(0, Math.min(C.pas.length - 1, i)); P = C.pas[rang]; afficherRemarques();
  son.pause(); arretA = null; choisi = null; phraseChoisie = -1; choisirOutil(null);
  son = P.audio ? audio : muette;
  if (P.audio) { audio.src = "/media/" + P.audio; audio.playbackRate = +$("vitesse").value; } else { audio.removeAttribute("src"); muette._t = 0; muette.playbackRate = +$("vitesse").value; }
  $("pas").value = rang; $("relu").checked = !!P.relu; location.hash = P.id;
  $("precedent").disabled = rang === 0; $("suivant").disabled = rang === C.pas.length - 1;
  $("lecture").disabled = !P.audio && !P.phrases.length;

  const p = C.pas.find(x => x.id === e.id); p.phrases = e.phrases; p.apparitions = e.apparitions; p.objets = e.objets || []; modifies.add(p.id); choisi = null;
  if (p !== P) ouvrir(C.pas.indexOf(p)); else { dessiner(); suivre(true); }
  etat();
}

async function enregistrer() {
  if (!modifies.size) { message("Rien à enregistrer"); return true; }
  const envoi = {};
  const acc = o => o.phrase != null ? { phrase: o.phrase, ancre: o.ancre || null, decalage_s: o.decalage_s != null ? o.decalage_s : null } : { phrase: null };
  for (const id of modifies) { const p = C.pas.find(x => x.id === id);
    const phrases = p.audio ? p.phrases : p.phrases.map(({ debut_s, fin_s, ...x }) => x);   /* instants estimés : jamais écrits */
    envoi[id] = { phrases, accroches: true, apparitions: Object.fromEntries(p.apparitions.map(a => [a.id, { debut_s: a.debut_s, ...acc(a) }])),
                  videos: Object.fromEntries((p.videos || []).map(v => [v.id, { debut_s: v.debut_s, ...acc(v), avec: v.phrase == null ? v.avec || null : null,
                    boucle: !!v.boucle, plein_ecran: !!v.plein_ecran, masquer: !!v.masquer, rembobiner: !!v.rembobiner }])),
                  objets: p.objets.map(o => ({ ...o, ...acc(o) })) }; if (p.reluChange) envoi[id].relu = !!p.relu; }
  try {
    const r = await (await fetch("/api/pas", { method: "POST", body: JSON.stringify(envoi) })).json();
    if (!r.ok) { message(r.message || "Enregistrement impossible", true); return false; }
    for (const id of modifies) { const p = C.pas.find(x => x.id === id); p.prepare = false; p.reluChange = false; p.phrases = p.phrases.filter(ph => ph.texte.trim()); }
    prendreRemarques(r); modifies.clear(); etat(); listePas(); afficherRemarques(); dessiner(); suivre(true);
    const ici = remarquesDe(P.id);
    message(ici.length ? r.message + " — ce pas : " + compte(ici) : r.message, ici.some(x => x.niveau === "erreur"));
    return true;
  } catch (e) { message("Le serveur ne répond pas : la fenêtre « capsuleforge relire » est-elle encore ouverte ?", true); return false; }
}
async function quitter() {
  if (!(await enregistrer())) return;
  son.pause(); fini = true;
  try { await fetch("/api/fin", { method: "POST" }); } catch (e) {}
  $("fini").style.display = "flex"; window.close();
}
$("quitter").onclick = quitter;

document.addEventListener("keydown", e => {
  const dansTexte = e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT";
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); enregistrer(); }
  else if (e.key === "Escape" && outil) { e.preventDefault(); choisirOutil(null); }
  else if (e.key === "Escape" || ((e.ctrlKey || e.metaKey) && e.code === "Space")) { e.preventDefault(); if (!$("lecture").disabled) $("lecture").click(); }
  else if ((e.key === "Delete" || e.key === "Backspace") && choisi && !dansTexte) { e.preventDefault(); supprimerObjet(choisi); }
  else if (e.code === "Space" && !dansTexte && e.target.tagName !== "BUTTON" && e.target.tagName !== "SELECT") { e.preventDefault(); $("lecture").click(); }
  else if (e.altKey && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault(); const l = e.target.closest ? e.target.closest(".phrase") : null;
    const i = (l ? +l.dataset.i : Math.max(0, actif)) + (e.key === "ArrowDown" ? 1 : -1);
    if (i >= 0 && i < P.phrases.length) { jouerPhrase(i); const t = $("phrases").querySelector(`.phrase[data-i="${i}"] textarea`); if (t && dansTexte) t.focus(); }
  }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !dansTexte) { e.preventDefault(); annuler(); }
});
window.addEventListener("beforeunload", e => { if (modifies.size && !fini) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("pagehide", () => { if (!fini) navigator.sendBeacon("/api/depart", ""); });
window.addEventListener("resize", () => document.querySelectorAll(".phrase textarea").forEach(hauteur));
requestAnimationFrame(boucle);
charger();
</script>
